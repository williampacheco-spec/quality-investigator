function shuffle(arr){ return [...arr].sort(()=>Math.random()-.5); }

// ===================== TIMER =====================
function Timer({seconds, onTimeout, paused, onTick}){
  const [left, setLeft] = useState(seconds);
  const ref = useRef(null);
  useEffect(()=>{ setLeft(seconds); }, [seconds]);
  useEffect(()=>{
    if(paused){ clearInterval(ref.current); return; }
    ref.current = setInterval(()=>{
      setLeft(p=>{
        const next = p-1;
        if(onTick) onTick(next);
        if(next<=0){ clearInterval(ref.current); onTimeout(); return 0; }
        return next;
      });
    },1000);
    return ()=>clearInterval(ref.current);
  },[paused, seconds]);

  const pct=(left/seconds)*100;
  const color = left>20?'var(--green)':left>10?'#cc7700':'var(--red)';
  const urgent = left<=10;

  return (
    <div style={{marginBottom:'1rem'}}>
      <div style={{display:'flex',alignItems:'center',gap:'.75rem',marginBottom:'.35rem'}}>
        <div style={{fontFamily:"'Special Elite',serif",fontSize:'.72rem',color:'var(--ink-light)',letterSpacing:2,fontWeight:'bold'}}>⏱ TEMPO</div>
        <div style={{
          fontFamily:"'Oswald',sans-serif",fontSize:'1.6rem',fontWeight:700,
          color:color,minWidth:44,textAlign:'center',
          animation:urgent?'timerPulse .5s ease-in-out infinite':'none',
        }}>{String(left).padStart(2,'0')}</div>
        <div style={{fontFamily:"'Special Elite',serif",fontSize:'.65rem',color:'var(--ink-light)',fontWeight:'bold'}}>SEG</div>
      </div>
      <div style={{height:8,background:'#e0d8c0',borderRadius:4,overflow:'hidden',border:'1px solid var(--border)'}}>
        <div style={{height:'100%',borderRadius:4,background:color,width:`${pct}%`,transition:'width 1s linear, background .3s'}}/>
      </div>
    </div>
  );
}

// ===================== COMPONENTES BASE =====================
const Btn = ({children,onClick,variant='default',style={},disabled=false})=>{
  const cols={
    default:{bg:'var(--gold)',text:'#fff',border:'var(--gold)',hbg:'var(--gold-light)'},
    outline:{bg:'transparent',text:'var(--gold)',border:'var(--gold)',hbg:'rgba(184,134,11,.1)'},
    green:{bg:'var(--green)',text:'#fff',border:'var(--green)',hbg:'#008844'},
    red:{bg:'var(--red)',text:'#fff',border:'var(--red)',hbg:'#aa1100'},
    gray:{bg:'#888',text:'#fff',border:'#888',hbg:'#666'},
  };
  const [hov,setHov]=useState(false);
  const c=cols[variant]||cols.default;
  return (
    <button onClick={disabled?undefined:onClick} disabled={disabled}
      onMouseEnter={()=>!disabled&&setHov(true)} onMouseLeave={()=>setHov(false)}
      style={{
        fontFamily:"'Oswald',sans-serif",fontSize:'1rem',letterSpacing:'2px',
        fontWeight:600,padding:'12px 28px',
        background:hov&&!disabled?c.hbg:c.bg,
        border:`2px solid ${c.border}`,color:c.text,
        borderRadius:'4px',cursor:disabled?'not-allowed':'pointer',
        textTransform:'uppercase',transition:'all .15s',
        opacity:disabled?.5:1,
        boxShadow:hov&&!disabled?'0 3px 12px rgba(0,0,0,0.2)':'0 2px 6px rgba(0,0,0,0.1)',
        ...style
      }}>{children}</button>
  );
};

// HUD

  <div style={{position:'sticky',top:0,zIndex:100,background:'#fff8ee',borderBottom:'3px solid var(--gold)',padding:'.6rem 1.2rem',display:'flex',alignItems:'center',gap:'1rem',flexWrap:'wrap',boxShadow:'0 2px 8px rgba(0,0,0,0.1)'}}>
    <div style={{display:'flex',alignItems:'center',gap:'.5rem'}}>
      <div style={{width:34,height:34,borderRadius:'50%',background:'var(--gold)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'.85rem',color:'#fff',fontFamily:"'Oswald',sans-serif",fontWeight:700}}>{email?email[0].toUpperCase():'?'}</div>
      <div style={{fontFamily:"'Courier Prime',monospace",fontSize:'.8rem',color:'var(--ink)',fontWeight:'bold',maxWidth:160,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{email||'ANALISTA'}</div>
    </div>
    <div style={{color:'var(--border)'}}>|</div>
    <div>
      <div style={{fontSize:'.6rem',color:'var(--ink-light)',letterSpacing:1,marginBottom:1,fontWeight:'bold'}}>XP</div>
      <div style={{color:'var(--gold)',fontWeight:700,fontSize:'1rem',fontFamily:"'Oswald',sans-serif"}}>{xp}</div>
    </div>
    <div style={{flex:1,minWidth:60}}>
      <div style={{height:6,background:'#e0d8c0',borderRadius:3,overflow:'hidden',border:'1px solid var(--border)'}}>
        <div style={{height:'100%',background:'var(--gold)',borderRadius:3,width:`${Math.min(100,xp/500*100)}%`,transition:'width .5s'}}/>
      </div>
    </div>
    <div style={{color:'var(--border)'}}>|</div>
    <div>
      <div style={{fontSize:'.6rem',color:'var(--ink-light)',letterSpacing:1,marginBottom:1,fontWeight:'bold'}}>VIDAS</div>
      <div style={{display:'flex',gap:3}}>{[0,1,2].map(i=><span key={i} style={{color:i<lives?'var(--red)':'#ccc',fontSize:'1.1rem'}}>♥</span>)}</div>
    </div>
    <div style={{color:'var(--border)'}}>|</div>
    <div>
      <div style={{fontSize:'.6rem',color:'var(--ink-light)',letterSpacing:1,marginBottom:1,fontWeight:'bold'}}>ACERTOS</div>
      <div style={{color:'var(--green)',fontWeight:700,fontSize:'.95rem',fontFamily:"'Oswald',sans-serif"}}>{correct}/{total}</div>
    </div>
  </div>
);

// OVERLAY PISTA NÃO VALIDADA (timeout)
const TimeoutOverlay = ({onContinue, correctOpt})=>{
  const [countdown, setCountdown] = useState(5);
  useEffect(()=>{
    const iv = setInterval(()=>setCountdown(c=>{ if(c<=1){clearInterval(iv);onContinue();return 0;} return c-1; }),1000);
    return ()=>clearInterval(iv);
  },[]);
  return (
    <div style={{position:'fixed',inset:0,background:'rgba(200,60,0,0.92)',zIndex:500,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',textAlign:'center',padding:'2rem',animation:'pistaFail .4s ease'}}>
      <div style={{fontSize:'5rem',marginBottom:'1rem'}}>⏰</div>
      <div style={{fontFamily:"'Oswald',sans-serif",fontSize:'clamp(1.5rem,5vw,2.5rem)',fontWeight:900,color:'#fff',letterSpacing:3,marginBottom:'.5rem'}}>PISTA NÃO VALIDADA!</div>
      <div style={{fontFamily:"'Courier Prime',monospace",fontSize:'1rem',color:'rgba(255,255,255,.85)',marginBottom:'1.5rem',lineHeight:1.8}}>Tempo esgotado! A resposta correta era:</div>
      <div style={{background:'rgba(255,255,255,.15)',border:'2px solid rgba(255,255,255,.4)',borderRadius:8,padding:'1rem 1.5rem',fontFamily:"'Oswald',sans-serif",fontSize:'1.1rem',color:'#fff',fontWeight:600,maxWidth:500,lineHeight:1.6,marginBottom:'1.5rem'}}>{correctOpt}</div>
      <div style={{fontFamily:"'Oswald',sans-serif",fontSize:'1.3rem',color:'rgba(255,255,255,.7)',letterSpacing:2}}>CONTINUANDO EM {countdown}s...</div>
      <div style={{marginTop:'1rem',height:6,width:200,background:'rgba(255,255,255,.2)',borderRadius:3,overflow:'hidden'}}>
        <div style={{height:'100%',background:'#fff',borderRadius:3,width:`${countdown/5*100}%`,transition:'width 1s linear'}}/>
      </div>
    </div>
  );
};

// TELA DE JOGO (perguntas corridas, sem missões)
const GameScreen = ({questions, email, hasPista, onFinish, onXP, onLoseLife, xp, lives, correct, total})=>{
  const [qIdx, setQIdx] = useState(0);
  const [selected, setSelected] = useState(null); // opção selecionada (não confirmada)
  const [confirmed, setConfirmed] = useState(false); // se confirmou
  const [timedOut, setTimedOut] = useState(false);
  const [showTimeout, setShowTimeout] = useState(false);
  const [timerKey, setTimerKey] = useState(0);
  const [timeLeft, setTimeLeft] = useState(30);

  const q = questions[qIdx];
  const isLast = qIdx >= questions.length - 1;

  // XP por velocidade: base 25 + bônus de até 15 pelo tempo restante
  const calcXP = (tLeft) => 25 + Math.floor((tLeft / 30) * 15);

  const handleTimeout = ()=>{
    if(confirmed) return;
    setTimedOut(true);
    setShowTimeout(true);
    onLoseLife();
  };

  const handleSelect = (i)=>{
    if(confirmed) return;
    setSelected(i);
  };

  const handleConfirm = ()=>{
    if(selected===null||confirmed) return;
    setConfirmed(true);
    const ok = selected === q.correct;
    if(ok){ const pts=calcXP(timeLeft); onXP(pts); }
    else{ onLoseLife(); }
  };

  const next = ()=>{
    if(isLast){ onFinish(); return; }
    setQIdx(i=>i+1);
    setSelected(null);
    setConfirmed(false);
    setTimedOut(false);
    setTimerKey(k=>k+1);
    setTimeLeft(30);
  };

  const pct = Math.round((qIdx/questions.length)*100);

  return (
    <div style={{background:'#f5f0e8',minHeight:'100vh'}}>
      {showTimeout&&<TimeoutOverlay correctOpt={q.opts[q.correct]} onContinue={()=>{setShowTimeout(false);next();}}/>}

      <HUD xp={xp} lives={lives} correct={correct} total={total} email={email}/>

      <div style={{maxWidth:680,margin:'0 auto',padding:'1.5rem'}}>
        {/* Progresso geral */}
        <div style={{marginBottom:'1rem'}}>
          <div style={{display:'flex',justifyContent:'space-between',fontFamily:"'Oswald',sans-serif",fontSize:'.85rem',color:'var(--ink-mid)',fontWeight:600,marginBottom:'.3rem'}}>
            <span>PERGUNTA {qIdx+1} DE {questions.length}</span>
            <span style={{color:'var(--gold)'}}>{pct}% CONCLUÍDO</span>
          </div>
          <div style={{height:8,background:'#e0d8c0',borderRadius:4,overflow:'hidden',border:'1px solid var(--border)'}}>
            <div style={{height:'100%',background:'var(--gold)',borderRadius:4,width:`${pct}%`,transition:'width .4s'}}/>
          </div>
        </div>

        {/* Timer */}
        {!confirmed&&!timedOut&&(
          <Timer key={timerKey} seconds={30} onTimeout={handleTimeout} paused={confirmed||timedOut} onTick={setTimeLeft}/>
        )}

        {/* Pergunta */}
        <div className="paper" style={{borderRadius:4,padding:'1.5rem',marginBottom:'1rem'}}>
          <div style={{fontFamily:"'Special Elite',serif",fontSize:'.7rem',color:'var(--red)',letterSpacing:2,marginBottom:'.75rem',fontWeight:'bold'}}>// PISTA {qIdx+1}</div>
          <div style={{fontFamily:"'Oswald',sans-serif",fontSize:'clamp(.95rem,2.5vw,1.15rem)',fontWeight:700,color:'var(--ink)',lineHeight:1.75}}>{q.q}</div>
        </div>

        {/* Opções */}
        <div style={{display:'flex',flexDirection:'column',gap:'.65rem',marginBottom:'1rem'}}>
          {q.opts.map((o,i)=>{
            let bg='#fff', border='var(--border)', col='var(--ink)', bw='2px';
            if(selected===i&&!confirmed){ bg='#fff8dd';border='var(--gold)';bw='3px'; }
            if(confirmed||timedOut){
              if(i===q.correct){ bg='#e8f5e8';border='var(--green)';col='var(--green)';bw='3px'; }
              else if(i===selected&&selected!==q.correct){ bg='#fde8e8';border='var(--red)';col='var(--red)';bw='3px'; }
            }
            return (
              <button key={i} onClick={()=>handleSelect(i)}
                disabled={confirmed||timedOut}
                style={{background:bg,border:`${bw} solid ${border}`,borderRadius:4,padding:'1rem 1.1rem',textAlign:'left',cursor:confirmed||timedOut?'default':'pointer',width:'100%',fontFamily:"'Courier Prime',monospace",fontSize:'clamp(.85rem,2vw,.95rem)',color:col,transition:'all .15s',fontWeight:'bold',lineHeight:1.6,boxShadow:selected===i&&!confirmed?'0 2px 8px rgba(184,134,11,.3)':'0 1px 3px rgba(0,0,0,.08)'}}>
                {o}
              </button>
            );
          })}
        </div>

        {/* Botão confirmar */}
        {!confirmed&&!timedOut&&(
          <div style={{textAlign:'center',marginBottom:'1rem'}}>
            <Btn onClick={handleConfirm} disabled={selected===null} variant={selected!==null?'default':'gray'} style={{width:'100%',fontSize:'1.1rem',padding:'14px'}}>
              ✓ CONFIRMAR RESPOSTA
            </Btn>
            {selected===null&&<div style={{marginTop:'.5rem',fontFamily:"'Oswald',sans-serif",fontSize:'.8rem',color:'var(--ink-light)',letterSpacing:1}}>Selecione uma opção antes de confirmar</div>}
          </div>
        )}

        {/* Feedback */}
        {(confirmed||timedOut)&&!showTimeout&&(
          <div className="fadein" style={{background:(!timedOut&&selected===q.correct)?'#e8f5e8':'#fde8e8',border:`2px solid ${(!timedOut&&selected===q.correct)?'var(--green)':'var(--red)'}`,borderRadius:4,padding:'1.1rem',marginBottom:'1rem'}}>
            <div style={{fontFamily:"'Oswald',sans-serif",fontSize:'.9rem',letterSpacing:1,color:(!timedOut&&selected===q.correct)?'var(--green)':'var(--red)',marginBottom:'.5rem',fontWeight:700}}>
              {(!timedOut&&selected===q.correct)?'✓ PISTA CONFIRMADA!':'✗ PISTA FALSA'}
            </div>
            <div style={{fontSize:'.9rem',lineHeight:1.8,color:'var(--ink)',fontWeight:'bold'}}>{(!timedOut&&selected===q.correct)?q.fb:q.fbWrong}</div>
          </div>
        )}

        {/* Próxima */}
        {(confirmed||timedOut)&&!showTimeout&&(
          <Btn onClick={next} variant={isLast?'green':'default'} style={{width:'100%',fontSize:'1.1rem',padding:'14px'}}>
            {isLast?'🏆 VER RESULTADO FINAL':'PRÓXIMA PISTA →'}
          </Btn>
        )}
      </div>
    </div>
  );
};

// TELA FINAL
const FinalScreen = ({email,xp,correct,total,timeSeconds,hasPista,onReset})=>{
  const pct = Math.round(correct/total*100);
  const rank = pct>=90?'DETETIVE LENDÁRIO':pct>=75?'INVESTIGADOR SÊNIOR':pct>=60?'ANALISTA CERTIFICADO':'INVESTIGADOR JÚNIOR';
  const badge = pct>=90?'🥇':pct>=75?'🥈':pct>=60?'🥉':'📋';
  const mins = Math.floor(timeSeconds/60), secs = timeSeconds%60;
  return (
    <div className="fadein" style={{background:'#f5f0e8',minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',padding:'2rem',textAlign:'center'}}>
      <div style={{fontSize:'4rem',marginBottom:'1rem',display:'inline-block',animation:'bounce 1s ease infinite'}}>🏆</div>
      <div style={{fontFamily:"'Special Elite',serif",fontSize:'.8rem',color:'var(--gold)',letterSpacing:4,marginBottom:'.5rem',fontWeight:'bold'}}>— INVESTIGAÇÃO CONCLUÍDA —</div>
      <div style={{fontFamily:"'Oswald',sans-serif",fontSize:'2rem',fontWeight:700,color:'var(--ink)',marginBottom:'.5rem'}}>CASO ENCERRADO!</div>
      <div style={{fontFamily:"'Courier Prime',monospace",fontSize:'.9rem',color:'var(--ink-mid)',fontWeight:'bold'}}>{email}</div>

      <div className="paper" style={{display:'inline-block',borderRadius:4,padding:'1rem 2rem',margin:'1.5rem 0',border:'3px solid var(--gold)'}}>
        <div style={{fontSize:'2.5rem',marginBottom:'.3rem'}}>{badge}</div>
        <div style={{fontFamily:"'Oswald',sans-serif",fontSize:'1rem',letterSpacing:3,color:'var(--gold)',fontWeight:700}}>{rank}</div>
      </div>

      <div className="paper" style={{borderRadius:4,padding:'1.5rem',textAlign:'left',marginBottom:'1.5rem',maxWidth:500,width:'100%'}}>
        {[
          ['XP Total', `${xp} XP`, 'var(--gold)'],
          ['Acertos', `${correct} / ${total}`, 'var(--green)'],
          ['Aproveitamento', `${pct}%`, 'var(--blue)'],
          ['Tempo Total', `${mins}m ${String(secs).padStart(2,'0')}s`, 'var(--ink)'],
          ['Bônus Pista', hasPista?'+10 XP ✓':'Não trouxe', hasPista?'var(--green)':'var(--ink-light)'],
        ].map(([l,v,c])=>(
          <div key={l} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'.7rem 0',borderBottom:'2px solid var(--border)'}}>
            <span style={{fontFamily:"'Oswald',sans-serif",fontSize:'.9rem',color:'var(--ink-mid)',fontWeight:600,letterSpacing:1}}>{l}</span>
            <span style={{fontFamily:"'Oswald',sans-serif",fontSize:'1rem',color:c,fontWeight:700}}>{v}</span>
          </div>
        ))}
      </div>

      <div style={{fontFamily:"'Courier Prime',monospace",fontSize:'.85rem',color:'var(--ink-mid)',lineHeight:1.9,marginBottom:'1.5rem',fontStyle:'italic',fontWeight:'bold'}}>"Qualidade não é punição — é parceria."<br/><span style={{fontSize:'.75rem',color:'var(--ink-light)'}}>— Pack Quality, InvOps Brasil</span></div>
    </div>
  );
};

// ===================== APP =====================
function App(){
  const [screen, setScreen] = useState('pista');
  const [hasPista, setHasPista] = useState(false);
  const [email, setEmail] = useState('');
  const [questions, setQuestions] = useState([]);
  const [xp, setXp] = useState(0);
  const [lives, setLives] = useState(3);
  const [correct, setCorrect] = useState(0);
  const [total, setTotal] = useState(0);
  const [startTime, setStartTime] = useState(null);
  const [alreadyPlayed, setAlreadyPlayed] = useState(false);

  const handlePista = (sim)=>{ setHasPista(sim); setScreen('name'); };

  const handleStart = async (em)=>{
    // Verifica se já jogou (localStorage)
    const key = 'qi_played_'+em.toLowerCase();
    if(localStorage.getItem(key)){
      setAlreadyPlayed(true);
      setEmail(em);
      setScreen('already');
      return;
    }
    setEmail(em);
    setQuestions(shuffle(ALL_QUESTIONS));
    const bonus = hasPista?10:0;
    setXp(bonus); setLives(3); setCorrect(0); setTotal(0);
    setStartTime(Date.now());
    setScreen('game');
  };

  const handleFinish = async ()=>{
    const elapsed = Math.round((Date.now()-startTime)/1000);
    const pct = total>0?Math.round(correct/total*100):0;
    // Marca como jogado
    localStorage.setItem('qi_played_'+email.toLowerCase(), '1');
    // Salva resultado
    await saveResult({ email, district:'Geral', xp, totalCorrect:correct, totalAnswered:total, pct, timeSeconds:elapsed, hasPista, completedAt:new Date().toISOString() });
    setScreen('final');
  };

  const elapsed = startTime?Math.round((Date.now()-startTime)/1000):0;

  if(screen==='already') return (
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:'100vh',background:'#f5f0e8',padding:'2rem',textAlign:'center',gap:'1.5rem'}}>
      <div style={{fontSize:'3rem'}}>🔒</div>
      <div style={{fontFamily:"'Oswald',sans-serif",fontSize:'1.5rem',fontWeight:700,color:'var(--red)'}}>CASO JÁ INVESTIGADO!</div>
      <div style={{fontFamily:"'Courier Prime',monospace",fontSize:'.95rem',color:'var(--ink-mid)',lineHeight:1.8,fontWeight:'bold',maxWidth:400}}>O e-mail <strong>{email}</strong> já participou desta investigação.<br/>Cada analista pode jogar apenas uma vez.</div>
      <div style={{fontFamily:"'Courier Prime',monospace",fontSize:'.85rem',color:'var(--ink-light)',lineHeight:1.8}}>Se acredita que isso é um erro, fale com o Pack Quality.</div>
    </div>
  );

  return (
    <div>
      {screen==='pista'&&<PistaScreen onAnswer={handlePista}/>}
      {screen==='name'&&<NameScreen hasPista={hasPista} onStart={handleStart}/>}
      {screen==='game'&&(
        <GameScreen
          questions={questions} email={email} hasPista={hasPista}
          xp={xp} lives={lives} correct={correct} total={total}
          onXP={v=>{ setXp(x=>x+v); setCorrect(c=>c+1); setTotal(t=>t+1); }}
          onLoseLife={()=>{ setLives(l=>Math.max(0,l-1)); setTotal(t=>t+1); }}
          onFinish={handleFinish}
        />
      )}
      {screen==='final'&&(
        <FinalScreen email={email} xp={xp} correct={correct} total={total} timeSeconds={elapsed} hasPista={hasPista} onReset={()=>setScreen('pista')}/>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
