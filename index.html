// ===================== MÚSICA =====================
function useBGMusic() {
  const ctxRef = useRef(null);
  const nodesRef = useRef([]);
  const playingRef = useRef(false);
  const enabledRef = useRef(true);
  const intervalRef = useRef(null);
  const getCtx = () => { if(!ctxRef.current) ctxRef.current=new(window.AudioContext||window.webkitAudioContext)(); return ctxRef.current; };
  const playNote = (freq,startTime,dur,type,vol,ac) => {
    if(!freq)return;
    const osc=ac.createOscillator(),gain=ac.createGain(),filter=ac.createBiquadFilter();
    filter.type='lowpass';filter.frequency.value=1200;
    osc.connect(filter);filter.connect(gain);gain.connect(ac.destination);
    osc.type=type;osc.frequency.value=freq;
    gain.gain.setValueAtTime(0,startTime);gain.gain.linearRampToValueAtTime(vol,startTime+0.02);
    gain.gain.setValueAtTime(vol,startTime+dur-0.05);gain.gain.linearRampToValueAtTime(0,startTime+dur);
    osc.start(startTime);osc.stop(startTime+dur);nodesRef.current.push(osc);
  };
  const melody=[[220,0.3],[261,0.3],[294,0.15],[261,0.15],[220,0.3],[196,0.6],[220,0.3],[261,0.3],[330,0.3],[294,0.3],[261,0.6],[196,0.3],[220,0.3],[261,0.15],[294,0.15],[330,0.3],[440,0.6],[330,0.3],[294,0.3],[261,0.3],[220,0.3],[196,0.6],[null,0.3]];
  const bass=[[110,0.6],[110,0.6],[130,0.6],[98,0.6],[110,0.6],[110,0.6],[130,0.3],[146,0.3],[110,0.6],[110,0.6],[130,0.6],[98,0.6],[110,0.6],[110,0.6],[123,0.6],[110,0.6]];
  const playSequence = () => {
    if(!enabledRef.current)return;
    const ac=getCtx();if(ac.state==='suspended')ac.resume();
    let t=ac.currentTime+0.1;
    melody.forEach(([freq,dur])=>{playNote(freq,t,dur*0.9,'triangle',0.1,ac);t+=dur;});
    let bt=ac.currentTime+0.1;
    bass.forEach(([freq,dur])=>{playNote(freq,bt,dur*0.8,'sawtooth',0.07,ac);bt+=dur*0.75;});
    let pt=ac.currentTime+0.1;
    for(let i=0;i<16;i++){const no=ac.createOscillator(),ng=ac.createGain();no.connect(ng);ng.connect(ac.destination);no.type='square';no.frequency.value=80;ng.gain.setValueAtTime(0.04,pt);ng.gain.linearRampToValueAtTime(0,pt+0.05);no.start(pt);no.stop(pt+0.05);pt+=0.375;}
    const totalDur=melody.reduce((s,[,d])=>s+d,0);
    intervalRef.current=setTimeout(playSequence,totalDur*1000-200);
  };
  const start=()=>{if(playingRef.current||!enabledRef.current)return;playingRef.current=true;playSequence();};
  const stop=()=>{playingRef.current=false;clearTimeout(intervalRef.current);nodesRef.current.forEach(n=>{try{n.stop();}catch(e){}});nodesRef.current=[];};
  const toggle=()=>{enabledRef.current=!enabledRef.current;if(!enabledRef.current)stop();else{playingRef.current=false;start();}return enabledRef.current;};
  const sfx={
    correct:()=>{if(!enabledRef.current)return;try{const ac=getCtx();if(ac.state==='suspended')ac.resume();[523,659,784,1047].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='triangle';o.frequency.value=f;const t=ac.currentTime+i*0.1;g.gain.setValueAtTime(0.2,t);g.gain.linearRampToValueAtTime(0,t+0.2);o.start(t);o.stop(t+0.2);});}catch(e){}},
    wrong:()=>{if(!enabledRef.current)return;try{const ac=getCtx();if(ac.state==='suspended')ac.resume();[220,196].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='sawtooth';o.frequency.value=f;const t=ac.currentTime+i*0.15;g.gain.setValueAtTime(0.15,t);g.gain.linearRampToValueAtTime(0,t+0.25);o.start(t);o.stop(t+0.25);});}catch(e){}},
    click:()=>{if(!enabledRef.current)return;try{const ac=getCtx();if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='sine';o.frequency.value=660;g.gain.setValueAtTime(0.08,ac.currentTime);g.gain.linearRampToValueAtTime(0,ac.currentTime+0.08);o.start();o.stop(ac.currentTime+0.08);}catch(e){}},
    victory:()=>{if(!enabledRef.current)return;try{const ac=getCtx();if(ac.state==='suspended')ac.resume();[523,587,659,698,784,880,988,1047].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='triangle';o.frequency.value=f;const t=ac.currentTime+i*0.1;g.gain.setValueAtTime(0.18,t);g.gain.linearRampToValueAtTime(0,t+0.3);o.start(t);o.stop(t+0.3);});}catch(e){}},
  };
  return{start,stop,toggle,sfx,isOn:()=>enabledRef.current};
}

const MissionScreen=({mission,onBack,onFinish,onXP,onLoseLife,sfx,onAnswer})=>{
  const [qIdx,setQIdx]=useState(0);
  const [answered,setAnswered]=useState(null);
  const [correct,setCorrect]=useState(0);
  const [total,setTotal]=useState(0);
  const [answers,setAnswers]=useState([]);
  const q=mission.questions[qIdx];
  const isLast=qIdx>=mission.questions.length-1;

  const answer=(i)=>{
    if(answered!==null)return;
    const ok=i===q.correct;
    setAnswered(i);setTotal(t=>t+1);
    setAnswers(prev=>[...prev,{question:q.q,chosen:q.opts[i],correct:q.opts[q.correct],ok}]);
    if(ok){setCorrect(c=>c+1);onXP(25);sfx.correct();}
    else{onLoseLife();sfx.wrong();}
  };
  const next=()=>{
    sfx.click();
    const fc=correct+(answered===q.correct?1:0),ft=total+1;
    if(isLast)onFinish(fc,ft,answers);
    else{setQIdx(q=>q+1);setAnswered(null);}
  };
  return (
    <div className="fadein" style={{maxWidth:720,margin:'0 auto',padding:'1.5rem'}}>
      <button onClick={()=>{sfx.click();onBack();}} style={{background:'none',border:'none',color:C.inkMuted,cursor:'pointer',fontFamily:"'Special Elite',serif",fontSize:'.78rem',marginBottom:'1.5rem',padding:0,letterSpacing:1}}>← VOLTAR AO MURAL</button>
      <div style={{display:'flex',gap:'1rem',alignItems:'center',marginBottom:'1.5rem',paddingBottom:'1rem',borderBottom:`1px solid ${C.inkDim}`}}>
        <div style={{width:52,height:52,borderRadius:2,background:'rgba(201,162,39,0.08)',border:`1px solid ${C.gold}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'1.6rem',flexShrink:0}}>{mission.icon}</div>
        <div>
          <div style={{fontFamily:"'Special Elite',serif",fontSize:'.65rem',color:C.inkMuted,letterSpacing:2,marginBottom:'.2rem'}}>{mission.caseNum}</div>
          <div style={{fontFamily:"'Oswald',sans-serif",fontSize:'1rem',color:C.ink,fontWeight:600}}>{mission.title}</div>
        </div>
      </div>
      <div className="paper redstring" style={{borderRadius:2,padding:'1.25rem',marginBottom:'1.1rem'}}>
        <div style={{fontFamily:"'Special Elite',serif",fontSize:'.65rem',color:C.redLight,letterSpacing:2,marginBottom:'.55rem'}}>// RELATO DO CASO</div>
        <p style={{lineHeight:1.9,fontSize:'.9rem',fontFamily:"'Courier Prime',monospace",color:C.ink}}>{mission.story}</p>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:'1rem',marginBottom:'1rem',fontFamily:"'Special Elite',serif",fontSize:'.7rem',color:C.inkMuted,letterSpacing:1}}>
        <span>PERGUNTA {qIdx+1}/{mission.questions.length}</span>
        <div style={{display:'flex',gap:5}}>{mission.questions.map((_,i)=><div key={i} style={{width:9,height:9,borderRadius:'50%',background:i<qIdx?C.gold:i===qIdx?'rgba(201,162,39,.4)':'#2a1f0a',border:`1px solid ${i<=qIdx?C.gold:C.inkDim}`,transition:'background .3s'}}/>)}</div>
      </div>
      <div style={{fontFamily:"'Oswald',sans-serif",fontSize:'1rem',fontWeight:600,color:C.ink,marginBottom:'.9rem',lineHeight:1.7}}>{q.q}</div>
      <div style={{display:'flex',flexDirection:'column',gap:'.55rem'}}>
        {q.opts.map((o,i)=>{
          let bg='rgba(0,0,0,0.3)',border=C.inkDim,col=C.inkMuted;
          if(answered!==null){if(i===q.correct){bg='rgba(74,138,42,0.15)';border=C.greenLight;col=C.ink;}else if(i===answered&&answered!==q.correct){bg='rgba(139,26,26,0.15)';border=C.redLight;col=C.ink;}}
          return <button key={i} onClick={()=>answer(i)} disabled={answered!==null} style={{background:bg,border:`1px solid ${border}`,borderRadius:2,padding:'.8rem 1rem',textAlign:'left',cursor:answered!==null?'default':'pointer',width:'100%',fontFamily:"'Courier Prime',monospace",fontSize:'.87rem',color:col,display:'flex',alignItems:'flex-start',gap:'.6rem',transition:'all .15s'}} onMouseEnter={e=>answered===null&&(e.currentTarget.style.borderColor=C.gold)} onMouseLeave={e=>answered===null&&(e.currentTarget.style.borderColor=C.inkDim)}><span style={{fontFamily:"'Special Elite',serif",color:C.gold,fontSize:'.7rem',minWidth:16,paddingTop:2,flexShrink:0}}>{'ABCD'[i]}</span><span>{o}</span></button>;
        })}
      </div>
      {answered!==null&&<div className="fadein" style={{background:answered===q.correct?'rgba(74,138,42,0.08)':'rgba(139,26,26,0.08)',border:`1px solid ${answered===q.correct?C.greenLight:C.redLight}`,borderRadius:2,padding:'1rem',marginTop:'.85rem'}}><div style={{fontFamily:"'Special Elite',serif",fontSize:'.68rem',letterSpacing:1,color:answered===q.correct?C.greenLight:C.redLight,marginBottom:'.45rem'}}>{answered===q.correct?'✓ PISTA CONFIRMADA!':'✗ PISTA FALSA'}</div><div style={{fontSize:'.87rem',lineHeight:1.8,fontFamily:"'Courier Prime',monospace",color:C.ink}}>{answered===q.correct?q.fb:q.fbWrong}</div></div>}
      {answered!==null&&<div style={{textAlign:'right',marginTop:'1.1rem'}}><DetBtn onClick={next} variant={isLast?'green':'default'}>{isLast?'ENCERRAR INVESTIGAÇÃO ◎':'PRÓXIMA PISTA →'}</DetBtn></div>}
    </div>
  );
};

      <div style={{fontFamily:"'Courier Prime',monospace",fontSize:'.85rem',color:C.inkMuted,marginBottom:'1.4rem'}}>{pct===100?'Você dominou todos os critérios!':pct>=75?'Ótima investigação!':pct>=50?'Passou! Reveja os erros.':'Precisa de 50% para avançar.'}</div>
      <div style={{fontFamily:"'Special Elite',serif",fontSize:'1.9rem',color:C.gold,marginBottom:'1.1rem'}}>+{correct*25} XP</div>
      <div className="paper" style={{borderRadius:2,display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'1rem',padding:'1.25rem',marginBottom:'1.4rem'}}>
        {[[String(correct),'Acertos',C.greenLight],[String(total),'Perguntas',C.ink],[pct+'%','Aproveit.',C.gold]].map(([v,l,c])=>(
          <div key={l} style={{textAlign:'center'}}><div style={{fontFamily:"'Oswald',sans-serif",fontSize:'1.3rem',fontWeight:700,color:c}}>{v}</div><div style={{fontSize:'.7rem',color:C.inkMuted,marginTop:'.2rem',fontFamily:"'Special Elite',serif",letterSpacing:1}}>{l}</div></div>
        ))}
      </div>
      <div style={{display:'flex',gap:'.9rem',flexWrap:'wrap',justifyContent:'center'}}>
        <DetBtn onClick={()=>{sfx.click();onBack();}}>PRÓXIMO CASO</DetBtn>
        <DetBtn variant="ghost" onClick={()=>{sfx.click();onRetry();}}>↺ REINVESTIGAR</DetBtn>
      </div>
      {showFinal&&<div style={{marginTop:'1.4rem'}}><DetBtn variant="green" onClick={()=>{sfx.victory();showFinal();}}>🏆 ENCERRAR O CASO</DetBtn></div>}
    </div>
  );
};

// FINAL
const FinalScreen=({email,district,xp,totalCorrect,totalAnswered,timeSeconds,hasPista,onReset,sfx})=>{
  const pct=Math.round(totalCorrect/totalAnswered*100);
  const rank=pct>=90?'DETETIVE LENDÁRIO':pct>=75?'INVESTIGADOR SÊNIOR':pct>=60?'ANALISTA CERTIFICADO':'INVESTIGADOR JÚNIOR';
  const badge=pct>=90?'🥇':pct>=75?'🥈':pct>=60?'🥉':'📋';
  const mins=Math.floor(timeSeconds/60),secs=timeSeconds%60;
  return (
    <div className="fadein" style={{maxWidth:640,margin:'0 auto',padding:'2rem',textAlign:'center'}}>
      <div style={{fontSize:'4rem',marginBottom:'.9rem',display:'inline-block',animation:'bounce 1s ease infinite'}}>🏆</div>
      <div style={{fontFamily:"'Special Elite',serif",fontSize:'.7rem',color:C.gold,letterSpacing:4,marginBottom:'.5rem'}}>— CASO ENCERRADO —</div>
      <div style={{fontFamily:"'Oswald',sans-serif",fontSize:'2rem',fontWeight:700,color:C.gold,textShadow:'0 0 30px rgba(201,162,39,.35)',marginBottom:'.7rem'}}>INVESTIGAÇÃO CONCLUÍDA</div>
      <div style={{fontFamily:"'Courier Prime',monospace",fontSize:'.88rem',color:C.inkMuted}}>{email} · Distrito {district}</div>
      <div className="paper" style={{display:'inline-block',borderRadius:2,padding:'1rem 2rem',margin:'1.5rem 0',border:`1px solid ${C.gold}`}}>
        <div style={{fontSize:'2rem',marginBottom:'.3rem'}}>{badge}</div>
        <div style={{fontFamily:"'Special Elite',serif",fontSize:'.82rem',letterSpacing:3,color:C.gold}}>{rank}</div>
      </div>
      <div className="paper" style={{borderRadius:2,padding:'1.5rem',textAlign:'left',marginBottom:'1.5rem'}}>
        {[
          ['XP Total',`${xp} XP`],
          ['Acertos Totais',`${totalCorrect} / ${totalAnswered}`],
          ['Aproveitamento Geral',`${pct}%`],
          ['Tempo Total',`${mins}m ${String(secs).padStart(2,'0')}s`],
          ['Bônus Pista',hasPista?'+10 XP ✓':'Não trouxe'],
          ['Casos Resolvidos','5 / 5'],
          ['Distrito',district],
        ].map(([l,v])=>(
          <div key={l} style={{display:'flex',justifyContent:'space-between',padding:'.65rem 0',borderBottom:`1px solid ${C.inkDim}`,fontSize:'.87rem'}}>
            <span style={{fontFamily:"'Courier Prime',monospace",color:C.inkMuted}}>{l}</span>
            <span style={{fontFamily:"'Special Elite',serif",color:C.gold,letterSpacing:1}}>{v}</span>
          </div>
        ))}
      </div>
      <div style={{fontFamily:"'Courier Prime',monospace",fontSize:'.82rem',color:C.inkMuted,lineHeight:1.9,marginBottom:'1.5rem',fontStyle:'italic'}}>"Qualidade não é punição — é parceria."<br/><span style={{fontSize:'.75rem',color:C.inkDim}}>— Pack Quality, InvOps Brasil</span></div>
      <DetBtn variant="green" onClick={()=>{sfx.click();onReset();}}>↺ NOVO CASO</DetBtn>
    </div>
  );
};

// ===================== APP =====================
function App(){
  const [screen,setScreen]=useState('pista');
  const [hasPista,setHasPista]=useState(false);
  const [email,setEmail]=useState('');
  const [district,setDistrict]=useState('');
  const [missions,setMissions]=useState([]);
  const [xp,setXp]=useState(0);
  const [lives,setLives]=useState(3);
  const [totalCorrect,setTotalCorrect]=useState(0);
  const [totalAnswered,setTotalAnswered]=useState(0);
  const [completed,setCompleted]=useState(new Set());
  const [activeMission,setActiveMission]=useState(null);
  const [missionResult,setMissionResult]=useState(null);
  const [musicOn,setMusicOn]=useState(true);
  const [startTime,setStartTime]=useState(null);
  const [allAnswers,setAllAnswers]=useState([]);
  const music=useBGMusic();

  const handlePista=(sim)=>{
    setHasPista(sim);
    setScreen('name');
  };

  const handleStart=(em,dist)=>{
    setEmail(em);setDistrict(dist);
    const built=buildMissions(dist);
    setMissions(built);
    const bonus=hasPista?10:0;
    setXp(bonus);
    setStartTime(Date.now());
    setScreen('map');
    setTimeout(()=>music.start(),300);
  };

  const goToMap=()=>{music.sfx.click();setScreen('map');};

  const startMission=(i)=>{music.sfx.click();setActiveMission(i);setScreen('mission');};

  const finishMission=(correct,total,answers)=>{
    const passed=correct/total>=0.5;
    if(passed)setCompleted(prev=>new Set([...prev,activeMission]));
    setTotalCorrect(c=>c+correct);
    setTotalAnswered(a=>a+total);
    setAllAnswers(prev=>[...prev,...answers]);
    setMissionResult({correct,total});
    setScreen('result');
    if(passed&&completed.size+1===missions.length)setTimeout(()=>music.sfx.victory(),400);
  };

  const showFinal=async()=>{
    const elapsed=Math.round((Date.now()-startTime)/1000);
    const pct=Math.round(totalCorrect/totalAnswered*100);
    // Salvar no Firebase
    await saveResult({
      email,district,
      xp:xp,
      totalCorrect,totalAnswered,
      pct,
      timeSeconds:elapsed,
      hasPista,
      answers:allAnswers,
      completedAt:new Date().toISOString(),
    });
    setScreen('final');
  };

  const resetGame=()=>{
    setScreen('pista');setEmail('');setDistrict('');setMissions([]);
    setXp(0);setLives(3);setTotalCorrect(0);setTotalAnswered(0);
    setCompleted(new Set());setActiveMission(null);setMissionResult(null);
    setHasPista(false);setStartTime(null);setAllAnswers([]);
    music.stop();
  };

  const toggleMusic=()=>{const on=music.toggle();setMusicOn(on);};
  const allDone=completed.size===missions.length&&missions.length>0;
  const elapsed=startTime?Math.round((Date.now()-startTime)/1000):0;

  return (
    <div style={{background:'#1a1208',color:'#e8dfc0',fontFamily:"'Courier Prime',monospace",minHeight:'100vh'}}>
      {!['pista','name'].includes(screen)&&(
        <HUD xp={xp} lives={lives} correct={totalCorrect} total={totalAnswered}
          email={email} musicOn={musicOn} onToggleMusic={toggleMusic}/>
      )}
      {screen==='pista'&&<PistaScreen onAnswer={handlePista} sfx={music.sfx}/>}
      {screen==='name'&&<NameScreen hasPista={hasPista} onStart={handleStart} sfx={music.sfx}/>}
      {screen==='map'&&<MapScreen email={email} district={district} completed={completed} missions={missions} onSelect={startMission} onFinal={showFinal} sfx={music.sfx}/>}
      {screen==='mission'&&activeMission!==null&&(
        <MissionScreen key={activeMission} mission={missions[activeMission]}
          onBack={goToMap} onFinish={finishMission}
          onXP={v=>setXp(x=>x+v)} onLoseLife={()=>setLives(l=>Math.max(0,l-1))}
          sfx={music.sfx}/>
      )}
      {screen==='result'&&missionResult&&(
        <ResultScreen correct={missionResult.correct} total={missionResult.total}
          onBack={goToMap} onRetry={()=>startMission(activeMission)}
          showFinal={allDone?showFinal:null} sfx={music.sfx}/>
      )}
      {screen==='final'&&(
        <FinalScreen email={email} district={district} xp={xp}
          totalCorrect={totalCorrect} totalAnswered={totalAnswered}
          timeSeconds={elapsed} hasPista={hasPista}
          onReset={resetGame} sfx={music.sfx}/>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
