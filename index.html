const C = {

// ===================== MÚSICA =====================
function useBGMusic() {
  const ctxRef=useRef(null),nodesRef=useRef([]),playingRef=useRef(false),enabledRef=useRef(true),intervalRef=useRef(null);
  const getCtx=()=>{if(!ctxRef.current)ctxRef.current=new(window.AudioContext||window.webkitAudioContext)();return ctxRef.current;};
  const playNote=(freq,st,dur,type,vol,ac)=>{
    if(!freq)return;
    const o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();
    f.type='lowpass';f.frequency.value=1200;o.connect(f);f.connect(g);g.connect(ac.destination);
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(vol,st+0.02);
    g.gain.setValueAtTime(vol,st+dur-0.05);g.gain.linearRampToValueAtTime(0,st+dur);
    o.start(st);o.stop(st+dur);nodesRef.current.push(o);
  };
  const melody=[[220,.3],[261,.3],[294,.15],[261,.15],[220,.3],[196,.6],[220,.3],[261,.3],[330,.3],[294,.3],[261,.6],[196,.3],[220,.3],[261,.15],[294,.15],[330,.3],[440,.6],[330,.3],[294,.3],[261,.3],[220,.3],[196,.6],[null,.3]];
  const bass=[[110,.6],[110,.6],[130,.6],[98,.6],[110,.6],[110,.6],[130,.3],[146,.3],[110,.6],[110,.6],[130,.6],[98,.6],[110,.6],[110,.6],[123,.6],[110,.6]];
  const playSeq=()=>{
    if(!enabledRef.current)return;
    const ac=getCtx();if(ac.state==='suspended')ac.resume();
    let t=ac.currentTime+.1;
    melody.forEach(([f,d])=>{playNote(f,t,d*.9,'triangle',.1,ac);t+=d;});
    let bt=ac.currentTime+.1;
    bass.forEach(([f,d])=>{playNote(f,bt,d*.8,'sawtooth',.07,ac);bt+=d*.75;});
    let pt=ac.currentTime+.1;
    for(let i=0;i<16;i++){const no=ac.createOscillator(),ng=ac.createGain();no.connect(ng);ng.connect(ac.destination);no.type='square';no.frequency.value=80;ng.gain.setValueAtTime(.04,pt);ng.gain.linearRampToValueAtTime(0,pt+.05);no.start(pt);no.stop(pt+.05);pt+=.375;}
    intervalRef.current=setTimeout(playSeq,melody.reduce((s,[,d])=>s+d,0)*1000-200);
  };
  const start=()=>{if(playingRef.current||!enabledRef.current)return;playingRef.current=true;playSeq();};
  const stop=()=>{playingRef.current=false;clearTimeout(intervalRef.current);nodesRef.current.forEach(n=>{try{n.stop();}catch(e){}});nodesRef.current=[];};
  const toggle=()=>{enabledRef.current=!enabledRef.current;if(!enabledRef.current)stop();else{playingRef.current=false;start();}return enabledRef.current;};
  const sfx={
    correct:()=>{if(!enabledRef.current)return;try{const ac=getCtx();if(ac.state==='suspended')ac.resume();[523,659,784,1047].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='triangle';o.frequency.value=f;const t=ac.currentTime+i*.1;g.gain.setValueAtTime(.2,t);g.gain.linearRampToValueAtTime(0,t+.2);o.start(t);o.stop(t+.2);});}catch(e){}},
    wrong:()=>{if(!enabledRef.current)return;try{const ac=getCtx();if(ac.state==='suspended')ac.resume();[220,196].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='sawtooth';o.frequency.value=f;const t=ac.currentTime+i*.15;g.gain.setValueAtTime(.15,t);g.gain.linearRampToValueAtTime(0,t+.25);o.start(t);o.stop(t+.25);});}catch(e){}},
    click:()=>{if(!enabledRef.current)return;try{const ac=getCtx();if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='sine';o.frequency.value=660;g.gain.setValueAtTime(.08,ac.currentTime);g.gain.linearRampToValueAtTime(0,ac.currentTime+.08);o.start();o.stop(ac.currentTime+.08);}catch(e){}},
    victory:()=>{if(!enabledRef.current)return;try{const ac=getCtx();if(ac.state==='suspended')ac.resume();[523,587,659,698,784,880,988,1047].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='triangle';o.frequency.value=f;const t=ac.currentTime+i*.1;g.gain.setValueAtTime(.18,t);g.gain.linearRampToValueAtTime(0,t+.3);o.start(t);o.stop(t+.3);});}catch(e){}},
    timeout:()=>{if(!enabledRef.current)return;try{const ac=getCtx();if(ac.state==='suspended')ac.resume();[440,330,220].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='sawtooth';o.frequency.value=f;const t=ac.currentTime+i*.18;g.gain.setValueAtTime(.15,t);g.gain.linearRampToValueAtTime(0,t+.3);o.start(t);o.stop(t+.3);});}catch(e){}},
  };
  return{start,stop,toggle,sfx,isOn:()=>enabledRef.current};
}

const ALL_QUESTIONS = [

  {q:"Qual é o canal oficial para abrir uma contestação de monitoria?",opts:["Slack direto para o analista de Quality","Portal Quality Requests via Jira Service Management","Formulário Google Forms por e-mail","Ticket no Databricks"],correct:1,fb:"Jira Quality Requests garante rastreabilidade, prazo de resposta e histórico estruturado.",fbWrong:"O canal correto é o Jira Quality Requests. Canais informais perdem rastreabilidade e prazo."},
  {q:"Por que muitos analistas têm receio de contestar um feedback do Quality mesmo quando discordam?",opts:["Porque o processo de contestação é muito caro e demorado","Por medo de parecer problemático — mas esse medo é infundado, contestar é um direito","Porque o Quality nunca reverte apontamentos","Porque a contestação exige aprovação prévia do gestor"],correct:1,fb:"Contestar com evidência é um direito do analista e ajuda o Quality a melhorar. Nunca há consequências negativas por contestar de forma fundamentada.",fbWrong:"O receio de represálias ao contestar é comum — mas infundado. Contestar com evidência é um direito e uma contribuição para a melhoria do processo."},

  {q:"Um analista recebeu um feedback NOK e discorda. O que ele deve fazer PRIMEIRO antes de contestar?",opts:["Mandar mensagem no Slack para o analista de Quality","Reunir a evidência técnica que mostra que o critério foi atendido","Escalar direto para o líder do distrito","Aguardar a próxima calibração para resolver"],correct:1,fb:"Antes de contestar, reúna a evidência. Contestação sem evidência técnica tende a ser improcedente. Com evidência sólida, o Quality reverte — e isso é bom para os dois lados.",fbWrong:"O primeiro passo é reunir a evidência técnica que contradiz o apontamento. Só depois abrir a contestação no Jira Quality Requests."},
  {q:"O Quality identificou um padrão de erro repetido em vários analistas do mesmo distrito. Qual é o próximo passo do Pack?",opts:["Aumentar o número de NOKs desse distrito no mês seguinte","Usar os dados para propor uma calibração e alinhar o critério com o distrito","Reportar o padrão apenas para os líderes sem envolver os analistas","Arquivar o padrão e aguardar a próxima monitoria"],correct:1,fb:"Padrão de erro = oportunidade de aprendizado coletivo. O Pack usa esses dados para propor calibrações e alinhar com o distrito — não para punir, mas para melhorar junto.",fbWrong:"Quando um padrão aparece, o Quality age como parceiro: leva o dado para uma calibração e alinha o critério com o distrito. O objetivo é melhorar, não punir."},

  const missions = [
    {id:0,title:"SCORECARD: DECIFRANDO O CÓDIGO",icon:"📊",caseNum:"CASO #001",desc:"Um apontamento NOK chegou na sua mesa. Investigue os critérios antes de tomar uma decisão.",tags:[{label:"Scorecard",color:C.gold}],xpReward:100,story:"O detetive recebeu um envelope lacrado. Dentro, um feedback NOK — o cliente foi bloqueado, o caso fechado. Mas algo está errado no processo. Investigue."},
    {id:1,title:"CONTESTAÇÃO: A ARTE DE DISCORDAR",icon:"⚖️",caseNum:"CASO #002",desc:"Uma analista sênior acredita que seu apontamento foi injusto.",tags:[{label:"Contestação",color:C.redLight}],xpReward:100,story:"Rosemeire (IC3s) trouxe evidências. O Quality disse que ela não verificou o dispositivo — mas ela tem screenshot. O caso está nas suas mãos."},
    {id:2,title:"QUALIDADE NA OPERAÇÃO",icon:"🔍",caseNum:"CASO #003",desc:"O dia a dia da operação sob o olhar do Quality.",tags:[{label:"Operação",color:C.greenLight}],xpReward:100,story:"Casos reais chegaram ao escritório. Cada decisão conta. O processo importa tanto quanto o resultado."},
    {id:3,title:"PARCERIA NA PRÁTICA",icon:"🤝",caseNum:"CASO #004",desc:"O dia a dia entre Quality e operação — situações reais que todo analista já viveu.",tags:[{label:"Parceria",color:C.greenLight}],xpReward:100,story:"Casos do cotidiano chegaram ao escritório. Cada situação é uma oportunidade de entender melhor como o Quality e a operação trabalham juntos."},
    {id:4,title:"MISSÃO FINAL: QUALIDADE É PARCERIA",icon:"🤝",caseNum:"CASO #005",desc:"O caso mais complexo. Integre tudo que você aprendeu.",tags:[{label:"Integração",color:C.gold}],xpReward:100,story:"Um analista IC3p com 18% de erros, várias contestações e um líder buscando respostas. O Quality tem os dados. A operação tem a experiência. Juntos, vão encontrar o caminho."},

// ===================== TIMER =====================
function Timer({seconds, onTimeout, paused}) {
  const [left, setLeft] = useState(seconds);
  const ref = useRef(null);
  useEffect(() => {
    setLeft(seconds);
  }, [seconds]);
  useEffect(() => {
    if(paused) { clearInterval(ref.current); return; }
    ref.current = setInterval(() => {
      setLeft(p => {
        if(p <= 1) { clearInterval(ref.current); onTimeout(); return 0; }
        return p - 1;
      });
    }, 1000);
    return () => clearInterval(ref.current);
  }, [paused, seconds]);

  const pct = (left / seconds) * 100;
  const color = left > 15 ? C.greenLight : left > 8 ? '#e67e22' : C.redLight;
  const urgent = left <= 8;

  return (
    <div style={{marginBottom:'1.1rem'}}>
      <div style={{display:'flex',alignItems:'center',gap:'.75rem',marginBottom:'.4rem'}}>
        <div style={{fontFamily:"'Special Elite',serif",fontSize:'.7rem',color:'rgba(232,223,192,.5)',letterSpacing:2}}>TEMPO</div>
        <div style={{
          fontFamily:"'Orbitron',monospace",fontSize:'1.4rem',fontWeight:700,
          color:color,
          animation: urgent ? 'timerPulse .6s ease-in-out infinite' : 'none',
          transition:'color .3s',
          minWidth:40,textAlign:'center',
        }}>
          {String(left).padStart(2,'0')}
        </div>
        <div style={{fontFamily:"'Special Elite',serif",fontSize:'.65rem',color:'rgba(232,223,192,.4)'}}>SEG</div>
      </div>
      <div style={{height:6,background:'rgba(255,255,255,.08)',borderRadius:3,overflow:'hidden'}}>
        <div style={{
          height:'100%',borderRadius:3,
          background: left > 15 ? `linear-gradient(90deg,${C.greenLight},#5daa35)` : left > 8 ? 'linear-gradient(90deg,#e67e22,#f39c12)' : `linear-gradient(90deg,${C.redLight},#e74c3c)`,
          width:`${pct}%`,
          transition:'width 1s linear, background .3s',
        }}/>
      </div>
    </div>
  );
}

// MISSÃO COM TIMER
const MissionScreen=({mission,onBack,onFinish,onXP,onLoseLife,sfx})=>{
  const [qIdx,setQIdx]=useState(0);
  const [answered,setAnswered]=useState(null);
  const [correct,setCorrect]=useState(0);
  const [total,setTotal]=useState(0);
  const [timerKey,setTimerKey]=useState(0);
  const [timedOut,setTimedOut]=useState(false);

  const q=mission.questions[qIdx];
  const isLast=qIdx>=mission.questions.length-1;

  const handleTimeout=()=>{
    if(answered!==null)return;
    sfx.timeout();
    setTimedOut(true);
    setAnswered(-1); // -1 = timeout
    setTotal(t=>t+1);
    onLoseLife();
  };

  const answer=(i)=>{
    if(answered!==null)return;
    const ok=i===q.correct;
    setAnswered(i);setTotal(t=>t+1);setTimedOut(false);
    if(ok){setCorrect(c=>c+1);onXP(25);sfx.correct();}
    else{onLoseLife();sfx.wrong();}
  };

  const next=()=>{
    sfx.click();
    const fc=correct+(answered===q.correct?1:0),ft=total+1;
    if(isLast)onFinish(fc,ft);
    else{setQIdx(q=>q+1);setAnswered(null);setTimedOut(false);setTimerKey(k=>k+1);}
  };

  return (
    <div className="fadein" style={{maxWidth:720,margin:'0 auto',padding:'1.5rem'}}>
      <button onClick={()=>{sfx.click();onBack();}} style={{background:'none',border:'none',color:C.inkMuted,cursor:'pointer',fontFamily:"'Special Elite',serif",fontSize:'.78rem',marginBottom:'1.5rem',padding:0,letterSpacing:1}}>← VOLTAR AO MURAL</button>
      <div style={{display:'flex',gap:'1rem',alignItems:'center',marginBottom:'1.5rem',paddingBottom:'1rem',borderBottom:`1px solid ${C.inkDim}`}}>
        <div style={{width:52,height:52,borderRadius:2,background:'rgba(201,162,39,0.08)',border:`1px solid ${C.gold}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'1.6rem',flexShrink:0}}>{mission.icon}</div>
        <div>
          <div style={{fontFamily:"'Special Elite',serif",fontSize:'.65rem',color:C.inkMuted,letterSpacing:2,marginBottom:'.2rem'}}>{mission.caseNum}</div>
          <div style={{fontFamily:"'Oswald',sans-serif",fontSize:'1rem',color:C.ink,fontWeight:600}}>{mission.title}</div>
        </div>
      </div>

      <div className="paper redstring" style={{borderRadius:2,padding:'1.25rem',marginBottom:'1.1rem'}}>
        <div style={{fontFamily:"'Special Elite',serif",fontSize:'.65rem',color:C.redLight,letterSpacing:2,marginBottom:'.55rem'}}>// RELATO DO CASO</div>
        <p style={{lineHeight:1.9,fontSize:'.9rem',fontFamily:"'Courier Prime',monospace",color:C.ink}}>{mission.story}</p>
      </div>

      {/* Progresso + Timer */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'.75rem',fontFamily:"'Special Elite',serif",fontSize:'.7rem',color:C.inkMuted,letterSpacing:1}}>
        <div style={{display:'flex',alignItems:'center',gap:'.75rem'}}>
          <span>PERGUNTA {qIdx+1}/{mission.questions.length}</span>
          <div style={{display:'flex',gap:5}}>{mission.questions.map((_,i)=><div key={i} style={{width:9,height:9,borderRadius:'50%',background:i<qIdx?C.gold:i===qIdx?'rgba(201,162,39,.4)':'#2a1f0a',border:`1px solid ${i<=qIdx?C.gold:C.inkDim}`,transition:'background .3s'}}/>)}</div>
        </div>
      </div>

      {/* Timer */}
      <Timer key={timerKey} seconds={25} onTimeout={handleTimeout} paused={answered!==null}/>

      <div style={{fontFamily:"'Oswald',sans-serif",fontSize:'1rem',fontWeight:600,color:C.ink,marginBottom:'.9rem',lineHeight:1.7}}>{q.q}</div>

      <div style={{display:'flex',flexDirection:'column',gap:'.55rem'}}>
        {q.opts.map((o,i)=>{
          let bg='rgba(0,0,0,0.3)',border=C.inkDim,col=C.inkMuted;
          if(answered!==null){
            if(i===q.correct){bg='rgba(74,138,42,0.15)';border=C.greenLight;col=C.ink;}
            else if(i===answered&&answered!==q.correct&&answered!==-1){bg='rgba(139,26,26,0.15)';border=C.redLight;col=C.ink;}
          }
          return <button key={i} onClick={()=>answer(i)} disabled={answered!==null}
            style={{background:bg,border:`1px solid ${border}`,borderRadius:2,padding:'.8rem 1rem',textAlign:'left',cursor:answered!==null?'default':'pointer',width:'100%',fontFamily:"'Courier Prime',monospace",fontSize:'.87rem',color:col,display:'flex',alignItems:'flex-start',gap:'.6rem',transition:'all .15s'}}
            onMouseEnter={e=>answered===null&&(e.currentTarget.style.borderColor=C.gold)}
            onMouseLeave={e=>answered===null&&(e.currentTarget.style.borderColor=C.inkDim)}>
            <span style={{fontFamily:"'Special Elite',serif",color:C.gold,fontSize:'.7rem',minWidth:16,paddingTop:2,flexShrink:0}}>{'ABCD'[i]}</span>
            <span>{o}</span>
          </button>;
        })}
      </div>

      {answered!==null&&(
        <div className="fadein" style={{background:timedOut?'rgba(139,26,26,0.12)':answered===q.correct?'rgba(74,138,42,0.08)':'rgba(139,26,26,0.08)',border:`1px solid ${timedOut||answered!==q.correct?C.redLight:C.greenLight}`,borderRadius:2,padding:'1rem',marginTop:'.85rem'}}>
          <div style={{fontFamily:"'Special Elite',serif",fontSize:'.68rem',letterSpacing:1,color:timedOut||answered!==q.correct?C.redLight:C.greenLight,marginBottom:'.45rem'}}>
            {timedOut?'⏰ TEMPO ESGOTADO!':answered===q.correct?'✓ PISTA CONFIRMADA!':'✗ PISTA FALSA'}
          </div>
          <div style={{fontSize:'.87rem',lineHeight:1.8,fontFamily:"'Courier Prime',monospace",color:C.ink}}>
            {timedOut||answered!==q.correct?q.fbWrong:q.fb}
          </div>
        </div>
      )}

      {answered!==null&&(
        <div style={{textAlign:'right',marginTop:'1.1rem'}}>
          <DetBtn onClick={next} variant={isLast?'green':'default'}>{isLast?'ENCERRAR INVESTIGAÇÃO ◎':'PRÓXIMA PISTA →'}</DetBtn>
        </div>
      )}
    </div>
  );
};

// ===================== APP =====================
function App(){
  const [screen,setScreen]=useState('pista');
  const [hasPista,setHasPista]=useState(false);
  const [name,setName]=useState('');
  const [missions,setMissions]=useState([]);
  const [xp,setXp]=useState(0);
  const [lives,setLives]=useState(3);
  const [totalCorrect,setTotalCorrect]=useState(0);
  const [totalAnswered,setTotalAnswered]=useState(0);
  const [completed,setCompleted]=useState(new Set());
  const [activeMission,setActiveMission]=useState(null);
  const [missionResult,setMissionResult]=useState(null);
  const [musicOn,setMusicOn]=useState(true);
  const [startTime,setStartTime]=useState(null);
  const music=useBGMusic();

  const handlePista=(sim)=>{setHasPista(sim);setScreen('name');};

  const handleStart=(n)=>{
    setName(n);
    setMissions(buildMissions());
    const bonus=hasPista?10:0;
    setXp(bonus);
    setStartTime(Date.now());
    setScreen('map');
    setTimeout(()=>music.start(),300);
  };

  const goToMap=()=>{music.sfx.click();setScreen('map');};
  const startMission=(i)=>{music.sfx.click();setActiveMission(i);setScreen('mission');};

  const finishMission=(correct,total)=>{
    const passed=correct/total>=0.5;
    if(passed)setCompleted(prev=>new Set([...prev,activeMission]));
    setTotalCorrect(c=>c+correct);
    setTotalAnswered(a=>a+total);
    setMissionResult({correct,total});
    setScreen('result');
    if(passed&&completed.size+1===missions.length)setTimeout(()=>music.sfx.victory(),400);
  };

  const showFinal=async()=>{
    const elapsed=Math.round((Date.now()-startTime)/1000);
    const pct=Math.round(totalCorrect/totalAnswered*100);
    await saveResult({
      email:name, // usando nome como identificador
      district:'Geral',
      xp, totalCorrect, totalAnswered, pct,
      timeSeconds:elapsed, hasPista,
      completedAt:new Date().toISOString(),
    });
    setScreen('final');
  };

  const resetGame=()=>{
    setScreen('pista');setName('');setMissions([]);
    setXp(0);setLives(3);setTotalCorrect(0);setTotalAnswered(0);
    setCompleted(new Set());setActiveMission(null);setMissionResult(null);
    setHasPista(false);setStartTime(null);music.stop();
  };

  const allDone=completed.size===missions.length&&missions.length>0;
  const elapsed=startTime?Math.round((Date.now()-startTime)/1000):0;

  return (
    <div style={{background:'#1a1208',color:'#e8dfc0',fontFamily:"'Courier Prime',monospace",minHeight:'100vh'}}>
      {!['pista','name'].includes(screen)&&(
        <HUD xp={xp} lives={lives} correct={totalCorrect} total={totalAnswered}
          name={name} musicOn={musicOn} onToggleMusic={()=>{const on=music.toggle();setMusicOn(on);}}/>
      )}
      {screen==='pista'&&<PistaScreen onAnswer={handlePista} sfx={music.sfx}/>}
      {screen==='name'&&<NameScreen hasPista={hasPista} onStart={handleStart} sfx={music.sfx}/>}
      {screen==='map'&&<MapScreen name={name} completed={completed} missions={missions} onSelect={startMission} onFinal={showFinal} sfx={music.sfx}/>}
      {screen==='mission'&&activeMission!==null&&(
        <MissionScreen key={activeMission} mission={missions[activeMission]}
          onBack={goToMap} onFinish={finishMission}
          onXP={v=>setXp(x=>x+v)} onLoseLife={()=>setLives(l=>Math.max(0,l-1))}
          sfx={music.sfx}/>
      )}
      {screen==='result'&&missionResult&&(
        <ResultScreen correct={missionResult.correct} total={missionResult.total}
          onBack={goToMap} onRetry={()=>startMission(activeMission)}
          showFinal={allDone?showFinal:null} sfx={music.sfx}/>
      )}
      {screen==='final'&&(
        <FinalScreen name={name} xp={xp}
          totalCorrect={totalCorrect} totalAnswered={totalAnswered}
          timeSeconds={elapsed} hasPista={hasPista}
          onReset={resetGame} sfx={music.sfx}/>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
