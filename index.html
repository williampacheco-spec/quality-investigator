  gold: '#c9a227',
  goldLight: '#e8c84a',

  redLight: '#c0392b',
  paper: '#2a1f0a',
  paperLight: '#3a2d14',
  ink: '#e8dfc0',
  inkMuted: '#9a8a6a',
  inkDim: '#6a5a3a',
  dark: '#0d0a04',
  green: '#2d5a1b',
  greenLight: '#4a8a2a',

// ===================== MÚSICA ARCADE =====================
function useBGMusic() {
  const ctxRef = useRef(null);
  const nodesRef = useRef([]);
  const playingRef = useRef(false);
  const enabledRef = useRef(true);
  const intervalRef = useRef(null);

  const getCtx = () => {
    if (!ctxRef.current) ctxRef.current = new (window.AudioContext || window.webkitAudioContext)();
    return ctxRef.current;
  };

  // Sequência noir/arcade: Am pentatônica estilo noir
  const melody = [
    [220,0.3],[261,0.3],[294,0.15],[261,0.15],[220,0.3],[196,0.6],
    [220,0.3],[261,0.3],[330,0.3],[294,0.3],[261,0.6],
    [196,0.3],[220,0.3],[261,0.15],[294,0.15],[330,0.3],[440,0.6],
    [330,0.3],[294,0.3],[261,0.3],[220,0.3],[196,0.6],[null,0.3],
  ];

  const bass = [
    [110,0.6],[110,0.6],[130,0.6],[98,0.6],
    [110,0.6],[110,0.6],[130,0.3],[146,0.3],
    [110,0.6],[110,0.6],[130,0.6],[98,0.6],
    [110,0.6],[110,0.6],[123,0.6],[110,0.6],
  ];

  const playNote = (freq, startTime, dur, type='sine', vol=0.12, ac) => {
    if (!freq) return;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    const filter = ac.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 1200;
    osc.connect(filter);
    filter.connect(gain);
    gain.connect(ac.destination);
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(vol, startTime + 0.02);
    gain.gain.setValueAtTime(vol, startTime + dur - 0.05);
    gain.gain.linearRampToValueAtTime(0, startTime + dur);
    osc.start(startTime);
    osc.stop(startTime + dur);
    nodesRef.current.push(osc);
  };

  const playSequence = useCallback(() => {
    if (!enabledRef.current) return;
    const ac = getCtx();
    if (ac.state === 'suspended') ac.resume();
    let t = ac.currentTime + 0.1;

    // Melodia
    melody.forEach(([freq, dur]) => {
      playNote(freq, t, dur * 0.9, 'triangle', 0.1, ac);
      t += dur;
    });

    // Baixo (loop menor)
    let bt = ac.currentTime + 0.1;
    bass.forEach(([freq, dur]) => {
      playNote(freq, bt, dur * 0.8, 'sawtooth', 0.07, ac);
      bt += dur * 0.75;
    });

    // Percussão simples
    let pt = ac.currentTime + 0.1;
    for (let i = 0; i < 16; i++) {
      const noiseNode = ac.createOscillator();
      const ng = ac.createGain();
      noiseNode.connect(ng); ng.connect(ac.destination);
      noiseNode.type = 'square';
      noiseNode.frequency.value = 80;
      ng.gain.setValueAtTime(0.04, pt);
      ng.gain.linearRampToValueAtTime(0, pt + 0.05);
      noiseNode.start(pt); noiseNode.stop(pt + 0.05);
      pt += 0.375;
    }

    const totalDur = melody.reduce((s,[,d])=>s+d,0);
    intervalRef.current = setTimeout(playSequence, totalDur * 1000 - 200);
  }, []);

  const start = useCallback(() => {
    if (playingRef.current || !enabledRef.current) return;
    playingRef.current = true;
    playSequence();
  }, [playSequence]);

  const stop = useCallback(() => {
    playingRef.current = false;
    clearTimeout(intervalRef.current);
    nodesRef.current.forEach(n => { try { n.stop(); } catch(e){} });
    nodesRef.current = [];
  }, []);

  const toggle = useCallback(() => {
    enabledRef.current = !enabledRef.current;
    if (!enabledRef.current) stop();
    else { playingRef.current = false; start(); }
    return enabledRef.current;
  }, [start, stop]);

  const sfx = {
    correct: () => {
      if (!enabledRef.current) return;
      try {
        const ac = getCtx();
        if (ac.state==='suspended') ac.resume();
        [523,659,784,1047].forEach((f,i) => {
          const o=ac.createOscillator(),g=ac.createGain();
          o.connect(g);g.connect(ac.destination);
          o.type='triangle';o.frequency.value=f;
          const t=ac.currentTime+i*0.1;
          g.gain.setValueAtTime(0.2,t);g.gain.linearRampToValueAtTime(0,t+0.2);
          o.start(t);o.stop(t+0.2);
        });
      } catch(e){}
    },
    wrong: () => {
      if (!enabledRef.current) return;
      try {
        const ac = getCtx();
        if (ac.state==='suspended') ac.resume();
        [220,196].forEach((f,i) => {
          const o=ac.createOscillator(),g=ac.createGain();
          o.connect(g);g.connect(ac.destination);
          o.type='sawtooth';o.frequency.value=f;
          const t=ac.currentTime+i*0.15;
          g.gain.setValueAtTime(0.15,t);g.gain.linearRampToValueAtTime(0,t+0.25);
          o.start(t);o.stop(t+0.25);
        });
      } catch(e){}
    },
    click: () => {
      if (!enabledRef.current) return;
      try {
        const ac = getCtx();
        if (ac.state==='suspended') ac.resume();
        const o=ac.createOscillator(),g=ac.createGain();
        o.connect(g);g.connect(ac.destination);
        o.type='sine';o.frequency.value=660;
        g.gain.setValueAtTime(0.08,ac.currentTime);
        g.gain.linearRampToValueAtTime(0,ac.currentTime+0.08);
        o.start();o.stop(ac.currentTime+0.08);
      } catch(e){}
    },
    victory: () => {
      if (!enabledRef.current) return;
      try {
        const ac = getCtx();
        if (ac.state==='suspended') ac.resume();
        [523,587,659,698,784,880,988,1047].forEach((f,i) => {
          const o=ac.createOscillator(),g=ac.createGain();
          o.connect(g);g.connect(ac.destination);
          o.type='triangle';o.frequency.value=f;
          const t=ac.currentTime+i*0.1;
          g.gain.setValueAtTime(0.18,t);g.gain.linearRampToValueAtTime(0,t+0.3);
          o.start(t);o.stop(t+0.3);
        });
      } catch(e){}
    },
  };

  return { start, stop, toggle, sfx, isOn: () => enabledRef.current };
}

const DetBtn = ({ children, onClick, variant='default', style={}, disabled=false }) => {
  const [hov, setHov] = useState(false);
  const colors = {
    default: { base: C.gold, hover: C.goldLight, bg: 'rgba(201,162,39,0.1)' },
    danger:  { base: C.redLight, hover: '#e74c3c', bg: 'rgba(192,57,43,0.1)' },
    ghost:   { base: C.inkMuted, hover: C.ink, bg: 'rgba(232,223,192,0.05)' },
    green:   { base: C.greenLight, hover: '#5daa35', bg: 'rgba(74,138,42,0.1)' },
  };
  const col = colors[variant] || colors.default;
  return (
    <button onClick={disabled ? undefined : onClick} disabled={disabled}
      onMouseEnter={() => !disabled && setHov(true)}
      onMouseLeave={() => setHov(false)}
      style={{
        fontFamily: "'Special Elite', serif",
        fontSize: '.82rem', letterSpacing: '2px',
        padding: '10px 24px',
        background: hov && !disabled ? col.bg : 'transparent',
        border: `1px solid ${hov && !disabled ? col.hover : col.base}`,
        color: hov && !disabled ? col.hover : col.base,
        borderRadius: '2px', cursor: disabled ? 'not-allowed' : 'pointer',
        textTransform: 'uppercase', transition: 'all .2s',
        opacity: disabled ? .5 : 1,
        boxShadow: hov && !disabled ? `0 0 12px ${col.bg}` : 'none',
        ...style
      }}>
      {children}
    </button>
  );
};

const MissionScreen = ({ mission, analyst, onBack, onFinish, onXP, onLoseLife, sfx }) => {
  const [qIdx, setQIdx] = useState(0);
  const [answered, setAnswered] = useState(null);
  const [correct, setCorrect] = useState(0);
  const [total, setTotal] = useState(0);

  const q = mission.questions[qIdx];
  const isLast = qIdx >= mission.questions.length - 1;

  const answer = (i) => {
    if (answered !== null) return;
    const ok = i === q.correct;
    setAnswered(i); setTotal(t => t+1);
    if (ok) { setCorrect(c => c+1); onXP(25); sfx.correct(); }
    else { onLoseLife(); sfx.wrong(); }
  };

  const next = () => {
    sfx.click();
    const finalC = correct + (answered===q.correct ? 1 : 0);
    const finalT = total + 1;
    if (isLast) onFinish(finalC, finalT);
    else { setQIdx(q => q+1); setAnswered(null); }
  };

  return (
    <div className="fadein" style={{ maxWidth:720, margin:'0 auto', padding:'1.5rem' }}>
      <button onClick={() => { sfx.click(); onBack(); }}
        style={{ background:'none', border:'none', color:C.inkMuted, cursor:'pointer', fontFamily:"'Special Elite',serif", fontSize:'.78rem', marginBottom:'1.5rem', padding:0, letterSpacing:1 }}>
        ← VOLTAR AO MURAL
      </button>

      {/* Header do caso */}
      <div style={{ display:'flex', gap:'1rem', alignItems:'center', marginBottom:'1.5rem', paddingBottom:'1rem', borderBottom:`1px solid ${C.inkDim}` }}>
        <div style={{ width:52, height:52, borderRadius:2, background:'rgba(201,162,39,0.08)', border:`1px solid ${C.gold}`, display:'flex', alignItems:'center', justifyContent:'center', fontSize:'1.6rem', flexShrink:0 }}>{mission.icon}</div>
        <div>
          <div style={{ fontFamily:"'Special Elite',serif", fontSize:'.65rem', color:C.inkMuted, letterSpacing:2, marginBottom:'.2rem' }}>{mission.caseNum}</div>
          <div style={{ fontFamily:"'Oswald',sans-serif", fontSize:'1rem', color:C.ink, fontWeight:600 }}>{mission.title}</div>
        </div>
      </div>

      {/* Briefing */}
      <div className="paper redstring" style={{ borderRadius:2, padding:'1.25rem', marginBottom:'1.1rem' }}>
        <div style={{ fontFamily:"'Special Elite',serif", fontSize:'.65rem', color:C.redLight, letterSpacing:2, marginBottom:'.55rem' }}>// RELATO DO CASO</div>
        <p style={{ lineHeight:1.9, fontSize:'.9rem', fontFamily:"'Courier Prime',monospace", color:C.ink }}>{mission.story}</p>
      </div>

      {/* Evidências */}
      <div style={{ background:'rgba(0,0,0,0.35)', border:`1px solid rgba(201,162,39,0.25)`, borderRadius:2, padding:'1rem', marginBottom:'1.1rem' }}>
        <div style={{ fontFamily:"'Special Elite',serif", fontSize:'.65rem', color:C.gold, letterSpacing:2, marginBottom:'.55rem' }}>📎 EVIDÊNCIAS DO CASO</div>
        {mission.evidence.map((e, i) => (
          <div key={i} style={{ display:'flex', gap:'.55rem', alignItems:'flex-start', margin:'.4rem 0', fontSize:'.85rem', fontFamily:"'Courier Prime',monospace" }}>
            <div style={{ width:5, height:5, borderRadius:'50%', background:C.gold, marginTop:'.42rem', flexShrink:0 }}/>
            <div style={{ color:C.ink }}>{e}</div>
          </div>
        ))}
      </div>

      {/* Progresso */}
      <div style={{ display:'flex', alignItems:'center', gap:'1rem', marginBottom:'1rem', fontFamily:"'Special Elite',serif", fontSize:'.7rem', color:C.inkMuted, letterSpacing:1 }}>
        <span>PERGUNTA {qIdx+1}/{mission.questions.length}</span>
        <div style={{ display:'flex', gap:5 }}>
          {mission.questions.map((_,i) => (
            <div key={i} style={{ width:9, height:9, borderRadius:'50%', background:i<qIdx?C.gold:i===qIdx?'rgba(201,162,39,.4)':'#2a1f0a', border:`1px solid ${i<=qIdx?C.gold:C.inkDim}`, transition:'background .3s' }}/>
          ))}
        </div>
      </div>

      {/* Pergunta */}
      <div style={{ fontFamily:"'Oswald',sans-serif", fontSize:'1rem', fontWeight:600, color:C.ink, marginBottom:'.9rem', lineHeight:1.7 }}>{q.q}</div>

      <div style={{ display:'flex', flexDirection:'column', gap:'.55rem' }}>
        {q.opts.map((o, i) => {
          let bg='rgba(0,0,0,0.3)', border=C.inkDim, col=C.inkMuted;
          if (answered !== null) {
            if (i===q.correct) { bg='rgba(74,138,42,0.15)'; border=C.greenLight; col=C.ink; }
            else if (i===answered && answered!==q.correct) { bg='rgba(139,26,26,0.15)'; border=C.redLight; col=C.ink; }
          }
          return (
            <button key={i} onClick={() => answer(i)} disabled={answered!==null}
              style={{ background:bg, border:`1px solid ${border}`, borderRadius:2, padding:'.8rem 1rem', textAlign:'left', cursor:answered!==null?'default':'pointer', width:'100%', fontFamily:"'Courier Prime',monospace", fontSize:'.87rem', color:col, display:'flex', alignItems:'flex-start', gap:'.6rem', transition:'all .15s' }}

      {answered !== null && (
        <div className="fadein" style={{ background: answered===q.correct?'rgba(74,138,42,0.08)':'rgba(139,26,26,0.08)', border:`1px solid ${answered===q.correct?C.greenLight:C.redLight}`, borderRadius:2, padding:'1rem', marginTop:'.85rem' }}>
          <div style={{ fontFamily:"'Special Elite',serif", fontSize:'.68rem', letterSpacing:1, color:answered===q.correct?C.greenLight:C.redLight, marginBottom:'.45rem' }}>
            {answered===q.correct ? '✓ PISTA CONFIRMADA!' : '✗ PISTA FALSA'}
          </div>
          <div style={{ fontSize:'.87rem', lineHeight:1.8, fontFamily:"'Courier Prime',monospace", color:C.ink }}>
            {answered===q.correct ? q.fb : q.fbWrong}
          </div>
        </div>
      )}

      {answered !== null && (
        <div style={{ textAlign:'right', marginTop:'1.1rem' }}>
          <DetBtn onClick={next} variant={isLast?'green':'default'}>
            {isLast ? 'ENCERRAR INVESTIGAÇÃO ◎' : 'PRÓXIMA PISTA →'}
          </DetBtn>
        </div>
      )}
    </div>
  );
};

      <div style={{ fontFamily:"'Special Elite',serif", fontSize:'1.9rem', color:C.gold, marginBottom:'1.1rem' }}>+{correct*25} XP</div>
      <div className="paper" style={{ borderRadius:2, display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:'1rem', padding:'1.25rem', marginBottom:'1.4rem' }}>
        {[[String(correct),'Acertos',C.greenLight],[String(total),'Perguntas',C.ink],[pct+'%','Aproveit.',C.gold]].map(([v,l,c])=>(
          <div key={l} style={{ textAlign:'center' }}>
            <div style={{ fontFamily:"'Oswald',sans-serif", fontSize:'1.3rem', fontWeight:700, color:c }}>{v}</div>
            <div style={{ fontSize:'.7rem', color:C.inkMuted, marginTop:'.2rem', fontFamily:"'Special Elite',serif", letterSpacing:1 }}>{l}</div>
          </div>
        ))}
      </div>
      <div style={{ display:'flex', gap:'.9rem', flexWrap:'wrap', justifyContent:'center' }}>
        <DetBtn onClick={() => { sfx.click(); onBack(); }}>PRÓXIMO CASO</DetBtn>
        <DetBtn variant="ghost" onClick={() => { sfx.click(); onRetry(); }}>↺ REINVESTIGAR</DetBtn>
      </div>
      {showFinal && <div style={{ marginTop:'1.4rem' }}><DetBtn variant="green" onClick={() => { sfx.victory(); showFinal(); }}>🏆 ENCERRAR O CASO</DetBtn></div>}
    </div>
  );
};

// TELA FINAL
const FinalScreen = ({ analyst, district, xp, totalCorrect, totalAnswered, onReset, sfx }) => {
  const pct = Math.round(totalCorrect/totalAnswered*100);
  const rank = pct>=90?'DETETIVE LENDÁRIO':pct>=75?'INVESTIGADOR SÊNIOR':pct>=60?'ANALISTA CERTIFICADO':'INVESTIGADOR JÚNIOR';
  const badge = pct>=90?'🥇':pct>=75?'🥈':pct>=60?'🥉':'📋';
  return (
    <div className="fadein" style={{ maxWidth:640, margin:'0 auto', padding:'2rem', textAlign:'center' }}>
      <div style={{ fontSize:'4rem', marginBottom:'.9rem', display:'inline-block', animation:'bounce 1s ease infinite' }}>🏆</div>
      <div style={{ fontFamily:"'Special Elite',serif", fontSize:'.7rem', color:C.gold, letterSpacing:4, marginBottom:'.5rem' }}>— CASO ENCERRADO —</div>
      <div style={{ fontFamily:"'Oswald',sans-serif", fontSize:'2rem', fontWeight:700, color:C.gold, textShadow:`0 0 30px rgba(201,162,39,.35)`, marginBottom:'.7rem' }}>
        INVESTIGAÇÃO CONCLUÍDA
      </div>
      <div style={{ fontFamily:"'Courier Prime',monospace", fontSize:'.88rem', color:C.inkMuted }}>Det. {analyst} · Distrito {district}</div>

      {/* Badge de rank */}
      <div className="paper" style={{ display:'inline-block', borderRadius:2, padding:'1rem 2rem', margin:'1.5rem 0', border:`1px solid ${C.gold}` }}>
        <div style={{ fontSize:'2rem', marginBottom:'.3rem' }}>{badge}</div>
        <div style={{ fontFamily:"'Special Elite',serif", fontSize:'.82rem', letterSpacing:3, color:C.gold }}>{rank}</div>
      </div>

      <div className="paper" style={{ borderRadius:2, padding:'1.5rem', textAlign:'left', marginBottom:'1.5rem' }}>
        {[['XP Total',`${xp} XP`],['Acertos Totais',`${totalCorrect} / ${totalAnswered}`],['Aproveitamento Geral',`${pct}%`],['Casos Resolvidos','5 / 5']].map(([l,v])=>(
          <div key={l} style={{ display:'flex', justifyContent:'space-between', padding:'.65rem 0', borderBottom:`1px solid ${C.inkDim}`, fontSize:'.87rem' }}>
            <span style={{ fontFamily:"'Courier Prime',monospace", color:C.inkMuted }}>{l}</span>
            <span style={{ fontFamily:"'Special Elite',serif", color:C.gold, letterSpacing:1 }}>{v}</span>
          </div>
        ))}
      </div>

      <div style={{ fontFamily:"'Courier Prime',monospace", fontSize:'.82rem', color:C.inkMuted, lineHeight:1.9, marginBottom:'1.5rem', fontStyle:'italic' }}>
        "Qualidade não é punição — é parceria."<br/>
        <span style={{ fontSize:'.75rem', color:C.inkDim }}>— Pack Quality, InvOps Brasil</span>
      </div>

      <DetBtn variant="green" onClick={() => { sfx.click(); onReset(); }}>↺ NOVO CASO</DetBtn>
    </div>
  );
};

// ===================== APP PRINCIPAL =====================
function App() {
  const [screen, setScreen] = useState('name');
  const [analyst, setAnalyst] = useState('');
  const [district, setDistrict] = useState('');
  const [xp, setXp] = useState(0);
  const [lives, setLives] = useState(3);
  const [totalCorrect, setTotalCorrect] = useState(0);
  const [totalAnswered, setTotalAnswered] = useState(0);
  const [completed, setCompleted] = useState(new Set());
  const [activeMission, setActiveMission] = useState(null);
  const [missionResult, setMissionResult] = useState(null);
  const [musicOn, setMusicOn] = useState(true);
  const music = useBGMusic();

  const handleStart = (name, dist) => {
    setAnalyst(name); setDistrict(dist);
    setScreen('map');
    setTimeout(() => music.start(), 300);
  };

  const goToMap = () => { music.sfx.click(); setScreen('map'); };

  const startMission = (i) => {
    music.sfx.click();
    setActiveMission(i); setScreen('mission');
  };

  const finishMission = (correct, total) => {
    const passed = correct/total >= 0.5;
    if (passed) setCompleted(prev => new Set([...prev, activeMission]));
    setTotalCorrect(c => c+correct);
    setTotalAnswered(a => a+total);
    setMissionResult({correct, total});
    setScreen('result');
    if (passed && completed.size+1 === MISSIONS.length) setTimeout(() => music.sfx.victory(), 400);
  };

  const showFinal = () => { setScreen('final'); };

  const resetGame = () => {
    setScreen('name'); setAnalyst(''); setDistrict('');
    setXp(0); setLives(3); setTotalCorrect(0); setTotalAnswered(0);
    setCompleted(new Set()); setActiveMission(null); setMissionResult(null);
    music.stop();
  };

  const toggleMusic = () => {
    const on = music.toggle();
    setMusicOn(on);
  };

  const allDone = completed.size === MISSIONS.length;

  return (
    <div style={{ background:'#1a1208', color:'#e8dfc0', fontFamily:"'Courier Prime',monospace", minHeight:'100vh' }}>
      {screen !== 'name' && (
        <HUD xp={xp} lives={lives} correct={totalCorrect} total={totalAnswered}
          analyst={analyst} musicOn={musicOn} onToggleMusic={toggleMusic} />
      )}
      {screen==='name' && <NameScreen onStart={handleStart} sfx={music.sfx} />}
      {screen==='map' && <MapScreen analyst={analyst} district={district} completed={completed} onSelect={startMission} onFinal={showFinal} sfx={music.sfx} />}
      {screen==='mission' && activeMission!==null && (
        <MissionScreen key={activeMission} mission={MISSIONS[activeMission]} analyst={analyst}
          onBack={goToMap} onFinish={finishMission}
          onXP={v=>setXp(x=>x+v)} onLoseLife={()=>setLives(l=>Math.max(0,l-1))}
          sfx={music.sfx} />
      )}
      {screen==='result' && missionResult && (
        <ResultScreen analyst={analyst} correct={missionResult.correct} total={missionResult.total}
          onBack={goToMap} onRetry={()=>startMission(activeMission)}
          showFinal={allDone?showFinal:null} sfx={music.sfx} />
      )}
      {screen==='final' && (
        <FinalScreen analyst={analyst} district={district} xp={xp}
          totalCorrect={totalCorrect} totalAnswered={totalAnswered}
          onReset={resetGame} sfx={music.sfx} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
