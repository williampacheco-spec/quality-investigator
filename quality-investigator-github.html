function useAudio() {
  const ctxRef = useRef(null);
  const onRef = useRef(true);
  const getCtx = () => { if (!ctxRef.current) ctxRef.current = new (window.AudioContext || window.webkitAudioContext)(); return ctxRef.current; };
  const tone = (freq, type, dur, vol=0.25) => {
    if (!onRef.current) return;
    try {
      const ac = getCtx(), o = ac.createOscillator(), g = ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
      o.start(); o.stop(ac.currentTime + dur);
    } catch(e) {}
  };
  return {
    toggle: () => { onRef.current = !onRef.current; return onRef.current; },
    isOn: () => onRef.current,
    correct: () => { tone(523,'sine',.1); setTimeout(()=>tone(659,'sine',.1),100); setTimeout(()=>tone(784,'sine',.2),200); },
    wrong: () => { tone(220,'sawtooth',.15,.18); setTimeout(()=>tone(196,'sawtooth',.2,.12),150); },
    click: () => tone(800,'sine',.06,.08),
    start: () => [440,494,523,587,659].forEach((f,i)=>setTimeout(()=>tone(f,'sine',.15),i*80)),
    victory: () => [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,'sine',.25),i*120)),
  };
}

    background:'transparent',

  }),

  mono: {fontFamily:'monospace'},
  muted: {color:'#7aad7a'},
};

function Btn({children, onClick, variant='default', style={}}) {
  const [hov, setHov] = useState(false);
  const base = S.btn(variant);
  const hovStyle = hov ? {background: variant==='gold'?'rgba(255,215,0,.1)':variant==='danger'?'rgba(255,68,68,.1)':'rgba(0,209,100,.1)', boxShadow:`0 0 14px ${variant==='gold'?'rgba(255,215,0,.25)':variant==='danger'?'rgba(255,68,68,.2)':'rgba(0,209,100,.22)'}`} : {};
  return <button style={{...base,...hovStyle,...style}} onClick={onClick} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}>{children}</button>;
}

      <div><div style={{...S.mono,...S.muted,fontSize:'.6rem',letterSpacing:1,marginBottom:2}}>ACERTOS</div><div style={{...S.mono,color:NU,fontWeight:700,fontSize:'.9rem'}}>{correct}/{total}</div></div>

      </div>
      <div style={{...S.card(),maxWidth:540,width:'100%',textAlign:'left'}}>
        <p style={{lineHeight:1.85,fontSize:'.92rem'}}>Você é um analista do time de <strong style={{color:NU}}>Investigações de Fraude</strong>. O Pack Quality identificou anomalias nos distritos — é hora de entrar em ação.</p>
        <p style={{lineHeight:1.85,fontSize:'.92rem',marginTop:'.7rem'}}>Enfrente <strong style={{color:NU}}>5 casos reais</strong> sobre scorecards, contestações, feedbacks e NPS. Cada decisão certa sobe sua pontuação. Erros custam vidas.</p>
        <div style={{background:'#162416',border:'1px solid rgba(0,209,100,.12)',borderRadius:8,padding:'1rem',marginTop:'1rem',...S.mono,fontSize:'.78rem',color:NU}}>
          {[['ANALISTA','<VOCÊ>'],['DISTRITO','TODOS OS DISTRITOS'],['STATUS','OPERAÇÃO ATIVA'],['MISSÕES','5  ·  XP TOTAL: 500']].map(([k,v])=>(
            <div key={k} style={{margin:'.3rem 0'}}><span style={S.muted}>{k}: </span>{v}</div>
          ))}
        </div>
      </div>
      <Btn onClick={onStart}>◉ INICIAR MISSÃO</Btn>
    </div>
  );
}

function MapScreen({completed, onSelect, onFinal}) {
  return (
    <div className="fadein" style={{padding:'2rem',minHeight:'80vh'}}>
      <div style={{maxWidth:960,margin:'0 auto'}}>
        <div style={{...S.mono,fontSize:'.95rem',color:NU,letterSpacing:2,marginBottom:'2rem'}}>◎ CENTRAL DE MISSÕES</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(250px,1fr))',gap:'1.1rem'}}>
          {MISSIONS.map((m,i)=>{
            const locked = i>0 && !completed.has(i-1);
            const done = completed.has(i);
            return (
              <div key={i} onClick={()=>!locked&&onSelect(i)}
                style={{...S.card({opacity:locked?.5:1,cursor:locked?'not-allowed':'pointer',position:'relative',border:done?'1px solid rgba(0,209,100,.5)':'1px solid rgba(0,209,100,.22)',transition:'transform .2s'})}}>
                {done && <div style={{position:'absolute',top:10,right:10,...S.mono,fontSize:'.58rem',color:NU,border:'1px solid rgba(0,209,100,.4)',padding:'2px 7px',borderRadius:2}}>✓ CONCLUÍDA</div>}
                <div style={{...S.mono,...S.muted,fontSize:'.62rem',letterSpacing:2,marginBottom:'.4rem'}}>MISSÃO {String(i+1).padStart(2,'0')}</div>
                {locked&&<div style={{fontSize:'1.4rem',margin:'.4rem 0'}}>🔒</div>}
                <div style={{fontSize:'.95rem',fontWeight:700,color:'#fff',marginBottom:'.35rem'}}>{m.icon} {m.title}</div>
                <div style={{fontSize:'.8rem',...S.muted,lineHeight:1.6,marginBottom:'.65rem'}}>{m.desc}</div>
                <div style={{display:'flex',gap:'.4rem',flexWrap:'wrap',marginBottom:'.5rem'}}>
                  {m.tags.map((t,j)=><span key={j} style={{fontSize:'.68rem',padding:'2px 9px',border:`1px solid ${t.color}55`,color:t.color,borderRadius:2,...S.mono}}>{t.label}</span>)}
                </div>
                <div style={{...S.mono,fontSize:'.68rem',color:'#ffd700'}}>+{m.xpReward} XP</div>
              </div>
            );
          })}
        </div>
        {completed.size===MISSIONS.length&&(
          <div style={{textAlign:'center',marginTop:'2rem'}}>
            <Btn variant="gold" onClick={onFinal}>🏆 VER RESULTADO FINAL</Btn>
          </div>
        )}
      </div>
    </div>
  );
}

function MissionScreen({mission, onBack, onFinish, onXP, onLoseLife, audio}) {
  const [qIdx, setQIdx] = useState(0);
  const [answered, setAnswered] = useState(null);
  const [correct, setCorrect] = useState(0);
  const [total, setTotal] = useState(0);
  const q = mission.questions[qIdx];
  const isLast = qIdx >= mission.questions.length - 1;

  const answer = (i) => {
    if (answered!==null) return;
    const ok = i===q.correct;
    setAnswered(i); setTotal(t=>t+1);
    if (ok) { setCorrect(c=>c+1); onXP(25); audio.correct(); }
    else { onLoseLife(); audio.wrong(); }
  };

  const next = () => {
    audio.click();
    const finalCorrect = correct + (answered===q.correct?1:0);
    const finalTotal = total + 1;
    if (isLast) onFinish(finalCorrect, finalTotal);
    else { setQIdx(q=>q+1); setAnswered(null); }
  };

  return (
    <div className="fadein" style={{maxWidth:740,margin:'0 auto',padding:'1.5rem'}}>
      <button onClick={()=>{audio.click();onBack();}} style={{background:'none',border:'none',...S.muted,cursor:'pointer',...S.mono,fontSize:'.78rem',marginBottom:'1.5rem',padding:0}}>← VOLTAR AO MAPA</button>
      <div style={{display:'flex',gap:'1rem',alignItems:'center',marginBottom:'1.6rem',paddingBottom:'1rem',borderBottom:'1px solid rgba(0,209,100,.12)'}}>
        <div style={{width:50,height:50,borderRadius:8,background:'#1f3a1f',border:'1px solid rgba(0,209,100,.22)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'1.5rem',flexShrink:0}}>{mission.icon}</div>
        <div>
          <div style={{...S.mono,fontSize:'.95rem',color:'#fff',fontWeight:700}}>{mission.title}</div>
          <div style={{fontSize:'.8rem',...S.muted,marginTop:'.2rem'}}>{mission.desc}</div>
        </div>
      </div>
      <div style={{...S.card({borderLeft:`3px solid ${NU}`,marginBottom:'1.1rem'})}}>
        <div style={{...S.mono,...{color:NU},fontSize:'.65rem',letterSpacing:2,marginBottom:'.55rem'}}>// BRIEFING DO CASO</div>
        <p style={{lineHeight:1.85,fontSize:'.9rem'}}>{mission.story}</p>
      </div>
      <div style={{background:'#162416',border:'1px solid rgba(255,170,0,.22)',borderRadius:8,padding:'1rem',marginBottom:'1.1rem'}}>
        <div style={{...S.mono,color:'#ffaa00',fontSize:'.65rem',letterSpacing:2,marginBottom:'.55rem'}}>📋 EVIDÊNCIAS DO CASO</div>
        {mission.evidence.map((e,i)=>(
          <div key={i} style={{display:'flex',gap:'.55rem',alignItems:'flex-start',margin:'.35rem 0',fontSize:'.86rem'}}>
            <div style={{width:5,height:5,borderRadius:'50%',background:'#ffaa00',marginTop:'.42rem',flexShrink:0}}/>
            <div>{e}</div>
          </div>
        ))}
      </div>
      <div style={{display:'flex',alignItems:'center',gap:'1rem',marginBottom:'1.1rem',...S.mono,fontSize:'.72rem',...S.muted}}>
        <span>PERGUNTA {qIdx+1}/{mission.questions.length}</span>
        <div style={{display:'flex',gap:5}}>
          {mission.questions.map((_,i)=>(
            <div key={i} style={{width:9,height:9,borderRadius:'50%',background:i<qIdx?NU:i===qIdx?'rgba(0,209,100,.42)':'#1f3a1f',border:`1px solid ${i<=qIdx?NU:'rgba(0,209,100,.18)'}`,transition:'background .3s'}}/>
          ))}
        </div>
      </div>
      <div style={{fontSize:'.95rem',fontWeight:600,color:'#fff',marginBottom:'.9rem',lineHeight:1.75}}>{q.q}</div>
      <div style={{display:'flex',flexDirection:'column',gap:'.6rem'}}>
        {q.opts.map((o,i)=>{
          let bg='#1a2e1a', border='rgba(0,209,100,.16)', col='#e8f5e8';
          if (answered!==null) {
            if (i===q.correct){bg='rgba(0,209,100,.1)';border=NU;col='#fff';}
            else if(i===answered&&answered!==q.correct){bg='rgba(255,68,68,.07)';border='#ff4444';col='#fff';}
          }
          return (
            <button key={i} onClick={()=>answer(i)} disabled={answered!==null}
              style={{background:bg,border:`1px solid ${border}`,borderRadius:8,padding:'.8rem 1rem',textAlign:'left',cursor:answered!==null?'default':'pointer',width:'100%',fontFamily:'inherit',fontSize:'.86rem',color:col,display:'flex',alignItems:'flex-start',gap:'.6rem',transition:'all .15s'}}>
              <span style={{...S.mono,color:NU,fontSize:'.7rem',minWidth:16,paddingTop:2,flexShrink:0}}>{'ABCD'[i]}</span>
              <span>{o}</span>
            </button>
          );
        })}
      </div>
      {answered!==null&&(
        <div className="fadein" style={{background:answered===q.correct?'rgba(0,209,100,.07)':'rgba(255,68,68,.05)',border:`1px solid ${answered===q.correct?'rgba(0,209,100,.3)':'rgba(255,68,68,.22)'}`,borderRadius:8,padding:'1rem',marginTop:'.85rem'}}>
          <div style={{...S.mono,fontSize:'.68rem',letterSpacing:1,color:answered===q.correct?NU:'#ff4444',marginBottom:'.45rem'}}>{answered===q.correct?'✓ CORRETO!':'✗ INCORRETO'}</div>
          <div style={{fontSize:'.86rem',lineHeight:1.78}}>{answered===q.correct?q.fb:q.fbWrong}</div>
        </div>
      )}
      {answered!==null&&(
        <div style={{textAlign:'right',marginTop:'1.1rem'}}>
          <Btn onClick={next}>{isLast?'VER RESULTADO ◎':'PRÓXIMA PERGUNTA →'}</Btn>
        </div>
      )}
    </div>
  );
}

function ResultScreen({correct, total, onBack, onRetry, showFinal}) {
  const pct = Math.round(correct/total*100);
  const passed = pct>=50;
  return (
    <div className="fadein" style={{maxWidth:520,margin:'0 auto',padding:'2rem',textAlign:'center'}}>
      <button onClick={onBack} style={{background:'none',border:'none',...S.muted,cursor:'pointer',...S.mono,fontSize:'.78rem',marginBottom:'1.5rem',display:'block',padding:0}}>← VOLTAR AO MAPA</button>
      <div style={{fontSize:'3.2rem',marginBottom:'.7rem'}}>{pct===100?'🏅':pct>=75?'⭐':pct>=50?'✅':'❌'}</div>
      <div style={{...S.mono,fontSize:'1.3rem',fontWeight:900,color:passed?'#fff':'#ff4444',marginBottom:'.45rem'}}>
        {pct===100?'PERFEITO!':pct>=75?'EXCELENTE!':pct>=50?'APROVADO!':'TENTE NOVAMENTE'}
      </div>
      <div style={{...S.muted,fontSize:'.85rem',marginBottom:'1.4rem'}}>
        {pct===100?'Você dominou todos os critérios desta missão!':pct>=75?'Ótimo desempenho! Você está no caminho certo.':pct>=50?'Passou! Reveja os erros para solidificar o conhecimento.':'Você precisa de pelo menos 50% de acertos para avançar.'}
      </div>
      <div style={{...S.mono,fontSize:'1.9rem',color:'#ffd700',marginBottom:'1.1rem'}}>+{correct*25} XP</div>
      <div style={{...S.card({display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'1rem',marginBottom:'1.4rem'})}}>
        {[[String(correct),'Acertos',NU],[String(total),'Perguntas','#e8f5e8'],[pct+'%','Aproveit.','#ffd700']].map(([v,l,c])=>(
          <div key={l} style={{textAlign:'center'}}>
            <div style={{...S.mono,fontSize:'1.3rem',fontWeight:700,color:c}}>{v}</div>
            <div style={{fontSize:'.7rem',...S.muted,marginTop:'.2rem'}}>{l}</div>
          </div>
        ))}
      </div>
      <div style={{display:'flex',gap:'.9rem',flexWrap:'wrap',justifyContent:'center'}}>
        <Btn onClick={onBack}>PRÓXIMA MISSÃO</Btn>
        <Btn variant="gold" onClick={onRetry}>↺ TENTAR NOVAMENTE</Btn>
      </div>
      {showFinal&&<div style={{marginTop:'1.4rem'}}><Btn variant="gold" onClick={showFinal}>🏆 VER RESULTADO FINAL</Btn></div>}
    </div>
  );
}

function FinalScreen({xp, totalCorrect, totalAnswered, onReset}) {
  const pct = Math.round(totalCorrect/totalAnswered*100);
  const rank = pct>=90?'LENDA DA QUALIDADE':pct>=75?'ANALISTA SÊNIOR QUALITY':pct>=60?'INVESTIGADOR CERTIFICADO':'INVESTIGADOR EM FORMAÇÃO';
  return (
    <div className="fadein" style={{maxWidth:600,margin:'0 auto',padding:'2rem',textAlign:'center'}}>
      <div style={{fontSize:'4rem',marginBottom:'.9rem',display:'inline-block',animation:'bounce 1s ease infinite'}}>🏆</div>
      <div style={{...S.mono,fontSize:'1.9rem',fontWeight:900,color:'#ffd700',textShadow:'0 0 30px rgba(255,215,0,.35)',marginBottom:'.7rem'}}>MISSÃO CUMPRIDA!</div>
      <p style={{...S.muted,fontSize:'.88rem'}}>Você completou todas as missões do Quality Investigator</p>
      <div style={{display:'inline-block',...S.mono,fontSize:'.78rem',letterSpacing:2,padding:'11px 26px',border:'2px solid #ffd700',color:'#ffd700',borderRadius:4,margin:'1.4rem 0'}}>{rank}</div>
      <div style={{...S.card({textAlign:'left',marginBottom:'1.4rem'})}}>
        {[['XP Total',`${xp} XP`],['Acertos Totais',`${totalCorrect} / ${totalAnswered}`],['Aproveitamento Geral',`${pct}%`],['Missões Concluídas','5 / 5']].map(([l,v])=>(
          <div key={l} style={{display:'flex',justifyContent:'space-between',padding:'.65rem 0',borderBottom:'1px solid rgba(0,209,100,.1)',fontSize:'.86rem'}}>
            <span style={S.muted}>{l}</span>
            <span style={{...S.mono,color:NU,fontWeight:700}}>{v}</span>
          </div>
        ))}
      </div>
      <p style={{...S.muted,fontSize:'.82rem',lineHeight:1.85,marginBottom:'1.4rem'}}>Agora você está preparado para atuar com excelência no Pack Quality. Lembre-se: qualidade não é punição — é parceria!</p>
      <Btn variant="gold" onClick={onReset}>↺ JOGAR NOVAMENTE</Btn>
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState('intro');
  const [xp, setXp] = useState(0);
  const [lives, setLives] = useState(3);
  const [totalCorrect, setTotalCorrect] = useState(0);
  const [totalAnswered, setTotalAnswered] = useState(0);
  const [completed, setCompleted] = useState(new Set());
  const [activeMission, setActiveMission] = useState(null);
  const [missionResult, setMissionResult] = useState(null);
  const [audioOn, setAudioOn] = useState(true);
  const audio = useAudio();

  const startGame = () => { audio.click(); setScreen('map'); };
  const goToMap = () => { audio.click(); setScreen('map'); };

  const startMission = (i) => { audio.start(); setActiveMission(i); setScreen('mission'); };

  const finishMission = (correct, total) => {
    const passed = correct/total >= 0.5;
    if (passed) setCompleted(prev => new Set([...prev, activeMission]));
    setTotalCorrect(c => c+correct);
    setTotalAnswered(a => a+total);
    setMissionResult({correct, total});
    setScreen('result');
    if (passed && completed.size+1 === MISSIONS.length) setTimeout(()=>audio.victory(), 400);
  };

  const showFinal = () => { audio.victory(); setScreen('final'); };

  const resetGame = () => {
    audio.click();
    setScreen('intro'); setXp(0); setLives(3);
    setTotalCorrect(0); setTotalAnswered(0);
    setCompleted(new Set()); setActiveMission(null); setMissionResult(null);
  };

  const hudMission = screen==='mission'&&activeMission!==null ? MISSIONS[activeMission].title : screen==='map' ? 'SELECIONE UMA MISSÃO' : screen==='result' ? 'RESULTADO DA MISSÃO' : '';
  const allDone = completed.size === MISSIONS.length;

  return (
    <div style={{background:'#0a0f0a',color:'#e8f5e8',fontFamily:"'Segoe UI',sans-serif",minHeight:'100vh'}}>
      {screen!=='intro' && (
        <HUD xp={xp} lives={lives} correct={totalCorrect} total={totalAnswered} mission={hudMission}
          audioOn={audioOn} onToggle={()=>{const s=audio.toggle();setAudioOn(s);}}/>
      )}
      {screen==='intro' && <IntroScreen onStart={startGame}/>}
      {screen==='map' && <MapScreen completed={completed} onSelect={startMission} onFinal={showFinal}/>}
      {screen==='mission' && activeMission!==null && (
        <MissionScreen key={activeMission} mission={MISSIONS[activeMission]} onBack={goToMap}
          onFinish={finishMission} onXP={v=>setXp(x=>x+v)} onLoseLife={()=>setLives(l=>Math.max(0,l-1))} audio={audio}/>
      )}
      {screen==='result' && missionResult && (
        <ResultScreen correct={missionResult.correct} total={missionResult.total}
          onBack={goToMap} onRetry={()=>startMission(activeMission)} showFinal={allDone?showFinal:null}/>
      )}
      {screen==='final' && (
        <FinalScreen xp={xp} totalCorrect={totalCorrect} totalAnswered={totalAnswered} onReset={resetGame}/>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
